<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>NeuoTunnel</title>
<style>
*,*::before,*::after{
  box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;
}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#020810;
  font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;
  color:#b8cce0;
  -webkit-font-smoothing:antialiased;
}

/* ── FULL-SCREEN SHELL ── */
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  background:#020810;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ══════════════════════════════════════
   TOP BAR
══════════════════════════════════════ */
#top{
  flex-shrink:0;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:rgba(2,8,16,.97);
  border-bottom:1px solid rgba(0,200,255,.15);
}
.logo{flex-shrink:0;}
.lt{font-size:12px;font-weight:800;letter-spacing:4px;color:#00e5ff;}
.ls{font-size:6px;letter-spacing:3.5px;color:#5fff80;margin-top:2px;}
.vsep{width:1px;height:26px;background:rgba(0,200,255,.15);flex-shrink:0;}
#cats{
  display:flex;gap:6px;flex:1;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:1px;
}
#cats::-webkit-scrollbar{display:none;}
.cat{
  flex-shrink:0;padding:6px 15px;border-radius:20px;
  border:1px solid rgba(255,255,255,.1);
  background:transparent;color:#445565;
  font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;
  -webkit-appearance:none;transition:all .15s;
}
.cat.on{
  color:#00e5ff;border-color:rgba(0,229,255,.6);
  background:rgba(0,229,255,.1);
}

/* ══════════════════════════════════════
   PHYLETIC TREE
══════════════════════════════════════ */
#tree-wrap{
  flex-shrink:0;height:130px;position:relative;
  background:radial-gradient(ellipse 90% 160% at 50% 110%,#050f22,#020810 65%);
  overflow:hidden;
}
#tree-svg{position:absolute;inset:0;width:100%;height:100%;}

/* strain tab row (below tree, above tiles) */
#strain-tabs{
  flex-shrink:0;display:flex;
  background:rgba(2,6,14,.98);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.stab{
  flex:1;padding:10px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;position:relative;
  border-bottom:2px solid transparent;
  transition:background .15s, border-color .15s;
}
.stab.on{border-bottom-color:var(--sc);}
.stab.on .stab-name{color:var(--sc);}
.stab-icon{font-size:16px;line-height:1;}
.stab-name{
  font-size:8px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:#334455;transition:color .15s;
}
.stab-hint{font-size:7px;letter-spacing:1px;color:#223344;}

/* ══════════════════════════════════════
   TILE COLUMNS  —  desktop: all 3 side by side
                    mobile (≤ 600px): one at a time
══════════════════════════════════════ */
#cols{
  flex:1;display:flex;overflow:hidden;
}

/* ── DESKTOP: three always-visible columns ── */
.col{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:10px 7px 30px;
}
.col::-webkit-scrollbar{display:none;}
#col-hybrid{
  border-left:1px solid rgba(255,255,255,.06);
  border-right:1px solid rgba(255,255,255,.06);
}

/* ── MOBILE (<600px): hide non-active columns ── */
@media (max-width:599px){
  .col{display:none;}
  .col.active{display:block;flex:1;}
  #strain-tabs{display:flex;}
}
@media (min-width:600px){
  #strain-tabs{display:none;}   /* desktop: tree labels enough */
  .col{display:block;}
}

/* ══════════════════════════════════════
   PRODUCT TILE
══════════════════════════════════════ */
.tile{
  position:relative;overflow:hidden;
  margin:6px 0;
  padding:14px 13px 12px;
  border-radius:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.042),rgba(255,255,255,.022));
  border:1px solid rgba(255,255,255,.09);
  border-left:3.5px solid var(--lc);
  cursor:pointer;
  transition:background .12s,transform .1s;
  -webkit-transform:translateZ(0); /* GPU layer iOS */
}
.tile:active{background:rgba(255,255,255,.08);transform:scale(.985);}

/* coloured glow sweep in corner */
.tile::before{
  content:'';position:absolute;top:0;right:0;
  width:45%;height:100%;
  background:linear-gradient(to left,rgba(var(--lr),var(--lg),var(--lb),.09),transparent 80%);
  pointer-events:none;
}

.t-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;}
.t-badge{
  font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--lc);opacity:.85;
  padding:2px 7px;border-radius:6px;
  background:rgba(var(--lr),var(--lg),var(--lb),.1);
  border:1px solid rgba(var(--lr),var(--lg),var(--lb),.2);
}
.t-price{font-size:15px;font-weight:800;color:#fff;}

.t-name{
  font-size:14px;font-weight:700;color:#e0eaf8;
  line-height:1.25;margin-bottom:4px;
}
.t-brand{font-size:10px;color:#3a5060;margin-bottom:8px;}

.t-foot{display:flex;align-items:center;justify-content:space-between;}
.t-thc{
  font-size:10px;color:rgba(var(--lr),var(--lg),var(--lb),.7);
  font-weight:600;
}
.t-dots{display:flex;gap:4px;}
.t-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(var(--lr),var(--lg),var(--lb),.4);
}

.empty{
  padding:40px 16px;text-align:center;
  font-size:13px;color:#223344;line-height:1.8;
}

/* ══════════════════════════════════════
   DIM OVERLAY
══════════════════════════════════════ */
#dim{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,3,10,.75);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#dim.show{opacity:1;pointer-events:auto;}

/* ══════════════════════════════════════
   BOTTOM DETAIL SHEET
══════════════════════════════════════ */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-height:82vh;
  background:#04091a;
  border-top:1px solid rgba(0,200,255,.2);
  border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;
  transform:translateY(108%);
  transition:transform .3s cubic-bezier(.22,.68,0,1.1);
  overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.open{transform:translateY(0);}

.sh-handle{
  flex-shrink:0;padding:12px 0 6px;
  display:flex;justify-content:center;cursor:grab;
}
.sh-handle div{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);}

#sh-close{
  position:absolute;top:11px;right:14px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#8899aa;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-appearance:none;
}

#sh-top{
  flex-shrink:0;padding:2px 16px 14px;
  display:flex;align-items:center;gap:14px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.sh-hex{flex-shrink:0;}
.sh-info{flex:1;min-width:0;}
.sh-name{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px;line-height:1.2;}
.sh-sub{font-size:11px;color:#3a5060;}
.sh-prc{font-size:26px;font-weight:800;flex-shrink:0;}

#sh-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 16px 20px;
}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.sc{background:rgba(255,255,255,.04);border-radius:10px;padding:9px 5px;text-align:center;}
.scl{font-size:7.5px;letter-spacing:1.5px;text-transform:uppercase;color:#2a3e50;margin-bottom:5px;}
.scv{font-size:13px;font-weight:700;color:#c0d0e8;}
.ssl{font-size:8.5px;letter-spacing:2.5px;text-transform:uppercase;
  color:#00e5ff;opacity:.4;margin:16px 0 8px;}
.sd{font-size:13.5px;color:#5a7080;line-height:1.65;}
.tl{display:flex;flex-wrap:wrap;gap:6px;}
.tc{font-size:11px;padding:4px 10px;border-radius:10px;
  background:rgba(255,255,255,.06);color:#6a8090;border:1px solid rgba(255,255,255,.07);}
.pb{font-size:11px;color:#2a4050;line-height:2;font-family:ui-monospace,monospace;}
.pf{font-weight:700;}
.sa{
  display:block;width:100%;margin-top:18px;
  padding:15px;border-radius:13px;
  background:linear-gradient(125deg,#00e5ff 0%,#5fff80 100%);
  color:#020810;font-size:15px;font-weight:800;
  border:none;cursor:pointer;letter-spacing:.4px;
  -webkit-appearance:none;
}
.sf{
  display:block;width:100%;margin-top:9px;
  padding:12px;border-radius:13px;
  background:transparent;border:1px solid rgba(255,255,255,.1);
  color:#3a5060;font-size:13px;cursor:pointer;
  -webkit-appearance:none;
}
</style>
</head>

function drawTree(){
  const wrap = document.getElementById('tree-wrap');
  const W = wrap.clientWidth  || window.innerWidth  || 390;
  const H = wrap.clientHeight || 130;
  const svg = document.getElementById('tree-svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const cx   = W / 2;
  const s_x  = W * (1/6);
  const h_x  = W * (1/2);
  const i_x  = W * (5/6);
  const rootY = H - 8;
  const forkY = H * .55;
  const tipY  = 16;
  const labelY= tipY + 14;

  // Cubic bezier branches
  const sBranch = `M ${cx} ${forkY} C ${cx} ${forkY*.6} ${s_x} ${forkY*.4} ${s_x} ${tipY}`;
  const hBranch = `M ${cx} ${forkY} L ${h_x} ${tipY}`;
  const iBranch = `M ${cx} ${forkY} C ${cx} ${forkY*.6} ${i_x} ${forkY*.4} ${i_x} ${tipY}`;
  const trunk   = `M ${cx} ${rootY} L ${cx} ${forkY}`;

  svg.innerHTML = `
    <defs>
      <filter id="gs" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
      </filter>
      <filter id="gh" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
      </filter>
      <filter id="gi" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
      </filter>
    </defs>

    <!-- trunk -->
    <path d="${trunk}" stroke="rgba(0,180,255,.18)" stroke-width="2" fill="none"/>
    <path d="${trunk}" stroke="rgba(0,180,255,.5)"  stroke-width="1" fill="none"/>

    <!-- sativa glow + line -->
    <path d="${sBranch}" stroke="#5fff80" stroke-width="4" fill="none" opacity=".18" filter="url(#gs)"/>
    <path d="${sBranch}" stroke="#5fff80" stroke-width="1.5" fill="none" opacity=".7"/>

    <!-- hybrid glow + line -->
    <path d="${hBranch}" stroke="#00e5ff" stroke-width="4" fill="none" opacity=".18" filter="url(#gh)"/>
    <path d="${hBranch}" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity=".7"/>

    <!-- indica glow + line -->
    <path d="${iBranch}" stroke="#b06fff" stroke-width="4" fill="none" opacity=".18" filter="url(#gi)"/>
    <path d="${iBranch}" stroke="#b06fff" stroke-width="1.5" fill="none" opacity=".7"/>

    <!-- root node -->
    <circle cx="${cx}" cy="${forkY}" r="4" fill="#00e5ff" opacity=".35"/>
    <circle cx="${cx}" cy="${forkY}" r="2" fill="#00e5ff" opacity=".7"/>

    <!-- branch tip nodes -->
    <circle cx="${s_x}" cy="${tipY}" r="5" fill="#5fff80" opacity=".25"/>
    <circle cx="${s_x}" cy="${tipY}" r="2.5" fill="#5fff80" opacity=".85"/>
    <circle cx="${h_x}" cy="${tipY}" r="5" fill="#00e5ff" opacity=".25"/>
    <circle cx="${h_x}" cy="${tipY}" r="2.5" fill="#00e5ff" opacity=".85"/>
    <circle cx="${i_x}" cy="${tipY}" r="5" fill="#b06fff" opacity=".25"/>
    <circle cx="${i_x}" cy="${tipY}" r="2.5" fill="#b06fff" opacity=".85"/>

    <!-- branch labels -->
    <text x="${s_x}" y="${labelY+13}" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="9" font-weight="700" letter-spacing="2.5"
      fill="#5fff80" opacity=".85">🌿 SATIVA</text>
    <text x="${h_x}" y="${labelY+13}" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="9" font-weight="700" letter-spacing="2.5"
      fill="#00e5ff" opacity=".85">⚡ HYBRID</text>
    <text x="${i_x}" y="${labelY+13}" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="9" font-weight="700" letter-spacing="2.5"
      fill="#b06fff" opacity=".85">🌙 INDICA</text>

    <!-- cannabis root label -->
    <text x="${cx}" y="${rootY-2}" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="7" letter-spacing="3"
      fill="rgba(0,180,255,.4)">CANNABIS</text>
  `;
}

// ══════════════════════════════════════
//  RENDER TILES
// ══════════════════════════════════════
function renderTiles(){
  ['sativa','hybrid','indica'].forEach(s => {
    const lc  = LANE[s];
    const arr = PRODS.filter(p => p.c === curCat && p.s === s);
    const el  = document.getElementById('list-'+s);

    if (!arr.length){
      el.innerHTML = `<div class="empty">${lc.icon}<br>No ${lc.label} products<br>in ${curCat}</div>`;
      return;
    }
    el.innerHTML = arr.map(p => `
      <div class="tile" data-id="${p.id}"
           style="--lc:${lc.c};--lr:${lc.r};--lg:${lc.g};--lb:${lc.b}">
        <div class="t-top">
          <span class="t-badge">${p.fx}</span>
          <span class="t-price">$${p.$}</span>
        </div>
        <div class="t-name">${p.n}</div>
        <div class="t-brand">${p.br}</div>
        <div class="t-foot">
          <span class="t-thc">${fmtThc(p.thc)} THC</span>
          <span class="t-dots">${p.t.slice(0,3).map(()=>'<span class="t-dot"></span>').join('')}</span>
        </div>
      </div>`
    ).join('');
  });
}

// ══════════════════════════════════════
//  DETAIL SHEET
// ══════════════════════════════════════
function openSheet(id){
  const p = PRODS.find(x => x.id === +id); if (!p) return;
  const lc  = LANE[p.s];
  const thcL = fmtThc(p.thc);
  const cbdL = p.cbd > 0 ? fmtThc(p.cbd) : 'None';

  const hexSvg = `<svg width="54" height="60" viewBox="0 0 54 60" xmlns="http://www.w3.org/2000/svg">
    <polygon points="27,3 51,16 51,44 27,57 3,44 3,16"
      fill="rgba(2,8,16,.95)" stroke="${lc.c}" stroke-width="2"/>
    <text x="27" y="25" text-anchor="middle" font-family="-apple-system,sans-serif"
      font-size="7.5" font-weight="700" fill="${lc.c}" letter-spacing="1">${p.fx}</text>
    <text x="27" y="41" text-anchor="middle" font-family="-apple-system,sans-serif"
      font-size="13" font-weight="800" fill="#ffffff">$${p.$}</text>
  </svg>`;

  document.getElementById('sh-top').innerHTML = `
    <div class="sh-hex">${hexSvg}</div>
    <div class="sh-info">
      <div class="sh-name">${p.n}</div>
      <div class="sh-sub">${p.s[0].toUpperCase()+p.s.slice(1)} · ${p.br} · ${thcL} THC</div>
    </div>
    <div class="sh-prc" style="color:${lc.c}">$${p.$}</div>
  `;

  const linNodes = [...p.lin, p.n].map((l,i,arr)=>{
    const pad = '&nbsp;'.repeat(i*4);
    const pre = i===0 ? '' : '└─ ';
    const cls = i===arr.length-1 ? `class="pf" style="color:${lc.c}"` : '';
    return `<div>${pad}${pre}<span ${cls}>${l}</span></div>`;
  }).join('');

  document.getElementById('sh-body').innerHTML = `
    <div class="sg">
      <div class="sc"><div class="scl">Effect</div><div class="scv" style="color:${lc.c}">${p.fx}</div></div>
      <div class="sc"><div class="scl">THC</div><div class="scv">${thcL}</div></div>
      <div class="sc"><div class="scl">CBD</div><div class="scv">${cbdL}</div></div>
      <div class="sc"><div class="scl">Price</div><div class="scv">$${p.$}</div></div>
    </div>
    <div class="ssl">About</div>
    <p class="sd">${p.d}</p>
    <div class="ssl">Terpenes</div>
    <div class="tl">${p.t.map(t=>`<span class="tc">${t}</span>`).join('')}</div>
    <div class="ssl">Phyletic Lineage</div>
    <div class="pb">${linNodes}</div>
    <button class="sa" onclick="addCart(${p.id})">Add to Cart &mdash; $${p.$}</button>
    <button class="sf" onclick="saveFav(${p.id})">☆ Save to Favourites</button>
  `;

  document.getElementById('sheet').classList.add('open');
  document.getElementById('dim').classList.add('show');
}

function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('dim').classList.remove('show');
}
function addCart(id){ const p=PRODS.find(x=>x.id===id); alert(`Added "${p.n}" to cart!`); }
function saveFav(id){ const p=PRODS.find(x=>x.id===id); alert(`Saved "${p.n}"`); }

// ══════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════

// Category pills
document.querySelectorAll('.cat').forEach(btn => {
  btn.addEventListener('click', ()=>{
    curCat = btn.dataset.c;
    document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b===btn));
    renderTiles();
  });
});

// Strain tabs (mobile)
document.querySelectorAll('.stab').forEach(tab => {
  tab.addEventListener('click', ()=>{
    curStrain = tab.dataset.s;
    document.querySelectorAll('.stab').forEach(t=>t.classList.toggle('on',t===tab));
    // show/hide columns
    document.querySelectorAll('.col').forEach(c=>{
      c.classList.toggle('active', c.id === 'col-'+curStrain);
    });
  });
});

// Tile tap — delegation on #cols
document.getElementById('cols').addEventListener('click', e=>{
  const tile = e.target.closest('.tile');
  if (tile) openSheet(tile.dataset.id);
});

// Sheet close
document.getElementById('sh-close').addEventListener('click', closeSheet);
document.getElementById('dim').addEventListener('click', closeSheet);

// Sheet swipe-down dismiss
let shY0 = 0;
const sheetEl = document.getElementById('sheet');
sheetEl.addEventListener('touchstart', e=>{ shY0=e.touches[0].clientY; }, {passive:true});
sheetEl.addEventListener('touchmove',  e=>{
  const dy = e.touches[0].clientY - shY0;
  if (dy>0) sheetEl.style.transform=`translateY(${dy}px)`;
}, {passive:true});
sheetEl.addEventListener('touchend', e=>{
  const dy = e.changedTouches[0].clientY - shY0;
  sheetEl.style.transform='';
  if (dy>70) closeSheet();
});

// Keyboard
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

// Resize
window.addEventListener('resize', drawTree);

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
drawTree();
renderTiles();
</script>
</body>
</html>
