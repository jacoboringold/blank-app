<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NeuoTunnel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000812;color:#c0d0e0;
  font-family:'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
}

/* ── ROOT fills the whole viewport ── */
#root{
  position:fixed;inset:0;
  /* safe area on iPhone notch/home bar */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── CANVAS fills root ── */
#c{position:absolute;inset:0;display:block;width:100%;height:100%}

/* ── TOP BAR ── */
#top{
  position:absolute;top:0;left:0;right:0;
  height:48px;z-index:20;
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:rgba(0,5,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(0,180,255,.18);
}
.logo-t{font-size:12px;font-weight:800;letter-spacing:3px;color:#00e5ff;white-space:nowrap}
.logo-s{font-size:7px;letter-spacing:3px;color:#5fff80;white-space:nowrap}
.vsep{width:1px;height:20px;background:rgba(0,180,255,.2);flex-shrink:0}
#cats{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cats::-webkit-scrollbar{display:none}
.cat{
  flex-shrink:0;padding:3px 11px;border-radius:14px;
  border:1px solid rgba(255,255,255,.1);background:transparent;
  color:#4a6070;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.16s;
}
.cat:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.cat.on{color:#00e5ff;border-color:#00e5ff;background:rgba(0,229,255,.12);box-shadow:0 0 10px rgba(0,229,255,.16)}
.ico{
  flex-shrink:0;width:32px;height:32px;border-radius:7px;
  background:rgba(255,255,255,.05);border:1px solid rgba(0,180,255,.18);
  color:#4a6070;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.16s;
}
.ico:hover,.ico.on{color:#00e5ff;border-color:#00e5ff;background:rgba(0,229,255,.1)}

/* ── FLOATING SIDE ARROWS ── */
.arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:36px;height:60px;z-index:15;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,5,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(0,180,255,.18);
  color:rgba(0,229,255,.6);font-size:16px;cursor:pointer;
  transition:.16s;user-select:none;
}
#arL{left:0;border-radius:0 10px 10px 0;border-left:none}
#arR{right:0;border-radius:10px 0 0 10px;border-right:none}
.arrow:hover{background:rgba(0,229,255,.14);color:#00e5ff}
.arrow:active{background:rgba(0,229,255,.25)}

/* ── FILTER DRAWER (slides from left) ── */
#drawer{
  position:absolute;top:48px;left:0;bottom:0;width:188px;z-index:30;
  background:rgba(0,5,18,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid rgba(0,180,255,.18);
  padding:13px 11px;overflow-y:auto;
  transform:translateX(-100%);transition:transform .26s cubic-bezier(.22,.68,0,1.1);
  scrollbar-width:thin;scrollbar-color:rgba(0,229,255,.18) transparent;
}
#drawer.open{transform:translateX(0)}
.dh{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:#00e5ff;opacity:.55;margin:13px 0 6px}
.dh:first-child{margin-top:0}
.drow{
  display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;
  font-size:12px;color:#c0d0e0;cursor:pointer;transition:.12s;user-select:none;
}
.drow:hover{background:rgba(0,229,255,.07);color:#fff}
.drow.on{background:rgba(0,229,255,.12);color:#00e5ff}
.ddot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chk{margin-left:auto;font-size:9px;color:#00e5ff;opacity:0;transition:.12s}
.drow.on .chk{opacity:1}
.dslider{width:100%;accent-color:#00e5ff;cursor:pointer;margin:5px 0 2px}
.dval{font-size:10px;color:#4a6070}
#mmap{
  width:100%;height:64px;margin-top:8px;
  border:1px solid rgba(0,229,255,.18);border-radius:6px;
  background:rgba(0,12,35,.7);position:relative;overflow:hidden;
}
.mmn{position:absolute;border-radius:50%}
.mmc{position:absolute;width:1.5px;height:100%;top:0;background:rgba(255,255,255,.5);box-shadow:0 0 6px rgba(255,255,255,.4);transition:left .2s}
.krow{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#4a6070;padding:2px 0}
.k{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:1px 5px;font-size:9px;color:#888}

/* ── DETAIL BOTTOM SHEET ── */
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:40;
  max-height:70vh;
  background:rgba(0,6,22,.97);
  border-top:1px solid rgba(0,180,255,.25);
  border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.22,.68,0,1.1);
}
#sheet.open{transform:translateY(0)}
/* drag handle */
#sheet-handle{
  flex-shrink:0;padding:10px;display:flex;align-items:center;justify-content:center;cursor:grab;
}
#sheet-handle div{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
/* hex accent header */
#sheet-hex{
  flex-shrink:0;padding:0 16px 12px;
  display:flex;align-items:center;gap:12px;
}
.sh-hex{flex-shrink:0}
.sh-info{flex:1;min-width:0}
.sh-name{font-size:17px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:2px}
.sh-sub{font-size:11px;color:#4a6070}
.sh-price{font-size:26px;font-weight:800;color:#fff;flex-shrink:0}
/* scrollable body */
#sheet-scroll{
  flex:1;overflow-y:auto;padding:0 16px 20px;
  scrollbar-width:thin;scrollbar-color:rgba(0,229,255,.18) transparent;
}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.sc{background:rgba(0,12,30,.8);border:1px solid rgba(0,180,255,.14);border-radius:8px;padding:8px 10px}
.scl{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#4a6070;margin-bottom:2px}
.scv{font-size:13px;font-weight:700;color:#fff}
.sdesc{font-size:11px;color:#c0d0e0;line-height:1.65;margin-bottom:12px}
.ssh{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#00e5ff;opacity:.6;margin-bottom:5px}
.tlist{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tc{font-size:10px;padding:3px 8px;border-radius:8px;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.2);color:#00e5ff}
.phylo{background:rgba(0,8,22,.8);border:1px solid rgba(0,180,255,.14);border-radius:8px;padding:10px;margin-bottom:14px;font-size:11px;line-height:2;color:#c0d0e0}
.pfin{font-weight:700}
.sadd{
  width:100%;padding:13px;border-radius:10px;
  font-size:14px;font-weight:800;border:none;cursor:pointer;
  background:linear-gradient(135deg,#00e5ff,#0070ff);color:#000;
  transition:.16s;margin-bottom:8px;
}
.sadd:hover{opacity:.88;box-shadow:0 0 22px rgba(0,229,255,.35)}
.sfav{
  width:100%;padding:11px;border-radius:10px;
  font-size:12px;font-weight:600;cursor:pointer;
  background:transparent;border:1px solid rgba(0,180,255,.2);color:#4a6070;transition:.16s;
}
.sfav:hover{border-color:#fff;color:#fff}
/* close button */
#sheet-close{
  position:absolute;top:10px;right:12px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:#aaa;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.14s;
}
#sheet-close:hover{background:rgba(255,255,255,.15);color:#fff}

/* ── DIM OVERLAY behind sheet ── */
#dim{
  position:absolute;inset:0;z-index:35;
  background:rgba(0,5,15,.6);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
#dim.show{opacity:1;pointer-events:auto}

/* ── PAUSE BADGE ── */
#po{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:18;pointer-events:none;
  font-size:11px;letter-spacing:4px;color:#4a6070;
  padding:8px 18px;background:rgba(0,5,15,.7);border-radius:20px;
  border:1px solid rgba(0,180,255,.15);
  display:none;
}
#po.show{display:block}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(0,229,255,.2);border-radius:2px}
</style>
</head>

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=1,H=1,bgT=0,sparks=[];

function resize(){
  const root=document.getElementById('root');
  W=cv.width =root.clientWidth  ||window.innerWidth;
  H=cv.height=root.clientHeight ||window.innerHeight;
  // force at least 100x100 so nothing is invisible
  if(W<10) W=cv.width =window.innerWidth;
  if(H<10) H=cv.height=window.innerHeight;
}

// ══════════════════════════════════════════
//  BACKGROUND
// ══════════════════════════════════════════
function addSpark(){
  const cs=['#5fff80','#00e5ff','#b06fff','#ffd060'];
  sparks.push({
    x:Math.random()*W, y:H*(.35+Math.random()*.65),
    r:Math.random()*1.8+.4, c:cs[Math.random()*4|0],
    vx:(Math.random()-.5)*18, vy:-(Math.random()*1.4+.5),
    life:1, d:Math.random()*.007+.003,
  });
}

function drawBg(dt){
  const vx=W/2, vy=H*.46;
  ctx.clearRect(0,0,W,H);

  // fill
  ctx.fillStyle='#000812'; ctx.fillRect(0,0,W,H);

  // nebula centre
  const nb=ctx.createRadialGradient(vx,vy,0,vx,vy,W*.5);
  nb.addColorStop(0,'rgba(0,22,80,.22)');
  nb.addColorStop(.6,'rgba(0,8,30,.1)');
  nb.addColorStop(1,'transparent');
  ctx.fillStyle=nb; ctx.fillRect(0,0,W,H);

  // tunnel rings
  for(let i=16;i>=0;i--){
    const t=i/16;
    ctx.beginPath();
    ctx.ellipse(vx,vy, Math.max(1,W*.58*t), Math.max(1,H*.54*t),0,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${(bgT*14+t*200)%360},72%,58%,${.04+t*.06})`;
    ctx.lineWidth=t<.2?.6:1.1;
    ctx.stroke();
  }

  // rail lines to vanishing point
  [-.46,-.16,.16,.46].forEach((xf,i)=>{
    ctx.beginPath();
    ctx.moveTo(vx+xf*W, H);
    ctx.lineTo(vx, vy);
    ctx.strokeStyle=`rgba(0,200,255,${i===0||i===3?.07:.04})`;
    ctx.lineWidth=i===0||i===3?1.1:.65;
    ctx.stroke();
  });

  // lane colour hazes
  Object.entries(LANE).forEach(([,l])=>{
    const gx=vx+l.xB*W*.5, gy=H*.7;
    const hg=ctx.createRadialGradient(gx,gy,0,gx,gy,W*.2);
    hg.addColorStop(0,rgba(l.c,.07));
    hg.addColorStop(1,'transparent');
    ctx.fillStyle=hg; ctx.fillRect(0,0,W,H);
  });

  // sparks
  if(Math.random()<.07) addSpark();
  for(let i=sparks.length-1;i>=0;i--){
    const sp=sparks[i];
    sp.x+=sp.vx*dt; sp.y+=sp.vy*55*dt; sp.life-=sp.d;
    if(sp.life<=0){sparks.splice(i,1);continue;}
    ctx.globalAlpha=sp.life*.7;
    ctx.beginPath(); ctx.arc(sp.x,sp.y,sp.r,0,Math.PI*2);
    ctx.fillStyle=sp.c; ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ══════════════════════════════════════════
//  PRODUCT HELPERS
// ══════════════════════════════════════════
function getProds(){
  return P
    .filter(p=>p.cat===ST.cat)
    .filter(p=>ST.strain==='all'||p.s===ST.strain)
    .filter(p=>p.thc<=ST.thcMax)
    .sort((a,b)=>{
      if(ST.sort==='price_asc')  return a.price-b.price;
      if(ST.sort==='price_desc') return b.price-a.price;
      if(ST.sort==='thc_desc')   return b.thc-a.thc;
      if(ST.sort==='terpene')    return a.terps[0].localeCompare(b.terps[0]);
      return a.name.localeCompare(b.name);
    });
}

function buildOrder(prods){
  const g={sativa:[],hybrid:[],indica:[]};
  prods.forEach(p=>{ if(g[p.s]) g[p.s].push(p); });
  const mx=Math.max(...Object.values(g).map(a=>a.length),0);
  const out=[];
  for(let i=0;i<mx;i++)
    ['sativa','hybrid','indica'].forEach(s=>{ if(g[s][i]) out.push({...g[s][i],ti:out.length}); });
  return out;
}

// ══════════════════════════════════════════
//  DRAW HEXAGONAL CARDS ON CANVAS
// ══════════════════════════════════════════
const SPAN=4.6, CN=168, CF=46;
let hits=[];  // click hit rects

function hexPath(ctx,x,y,w,h){
  const hw=w/2, hh=h/2;
  ctx.beginPath();
  ctx.moveTo(x-hw*.5, y-hh);
  ctx.lineTo(x+hw*.5, y-hh);
  ctx.lineTo(x+hw,    y);
  ctx.lineTo(x+hw*.5, y+hh);
  ctx.lineTo(x-hw*.5, y+hh);
  ctx.lineTo(x-hw,    y);
  ctx.closePath();
}

function drawCards(ordered,total){
  if(!total){hits=[];return;}
  hits=[];
  const vx=W/2, vy=H*.46;
  const items=[];
  ordered.forEach((prod,i)=>{
    let rel=i-ST.off%(total||1);
    if(total>=6){ while(rel>total/2)rel-=total; while(rel<-total/2)rel+=total; }
    if(Math.abs(rel)>SPAN) return;
    const depth=Math.max(0,1-Math.abs(rel)/SPAN);
    const ease=depth*depth;
    items.push({prod,rel,depth,ease});
  });
  items.sort((a,b)=>a.depth-b.depth); // far→near

  const prev={};

  items.forEach(({prod,rel,depth,ease})=>{
    const l=LANE[prod.s]||LANE.hybrid;
    const col=l.c;
    const px=vx + l.xB*W*ease*.74;
    const py=vy + l.yB*H*ease*.46 + rel*H*.038*(1-depth*.5);
    const cw=CF+(CN-CF)*ease;
    const ch=cw*1.12;
    const alpha=.18+depth*.82;
    const isSel=ST.sel===prod.id;

    // branch line (Bézier)
    if(prev[prod.s]&&depth>.08){
      const pv=prev[prod.s];
      const mx=(pv.x+px)/2, my=(pv.y+py)/2-12*ease;
      ctx.beginPath();
      ctx.moveTo(pv.x,pv.y);
      ctx.quadraticCurveTo(mx,my,px,py);
      ctx.strokeStyle=rgba(col,Math.min(depth,pv.depth)*.28);
      ctx.setLineDash([3,9]);
      ctx.lineWidth=ease*1.6;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    prev[prod.s]={x:px,y:py,depth};

    // outer glow
    if(ease>.1){
      const gr=ctx.createRadialGradient(px,py,0,px,py,cw*.78);
      gr.addColorStop(0,rgba(col,ease*(isSel?.32:.12)));
      gr.addColorStop(1,'transparent');
      ctx.fillStyle=gr;
      ctx.beginPath(); ctx.arc(px,py,cw*.78,0,Math.PI*2); ctx.fill();
    }

    // hex fill
    ctx.globalAlpha=alpha;
    hexPath(ctx,px,py,cw,ch);
    ctx.fillStyle=`rgba(0,${8+ease*14|0},${22+ease*28|0},.93)`;
    ctx.fill();

    // hex stroke
    ctx.strokeStyle=isSel ? col : rgba(col,.4+ease*.5);
    ctx.lineWidth=isSel?2.8:ease*1.5+.4;
    ctx.stroke();

    // selected rings
    if(isSel){
      hexPath(ctx,px,py,cw+8,ch+8);
      ctx.strokeStyle=rgba(col,.4+Math.sin(bgT*3)*.25);
      ctx.lineWidth=3; ctx.stroke();
      hexPath(ctx,px,py,cw+18,ch+18);
      ctx.strokeStyle=rgba(col,.15+Math.sin(bgT*3+1)*.1);
      ctx.lineWidth=2; ctx.stroke();
    }

    // text (only when big enough)
    if(cw>68){
      const fs=Math.max(7.5, cw*.073);
      ctx.globalAlpha=alpha;
      ctx.textAlign='center';

      // effect tag
      ctx.font=`600 ${fs*.8}px 'Segoe UI',sans-serif`;
      ctx.fillStyle=col; ctx.globalAlpha=alpha*.8;
      ctx.fillText(prod.fx, px, py-ch*.25);

      // name — word wrap
      ctx.globalAlpha=alpha;
      ctx.font=`700 ${fs}px 'Segoe UI',sans-serif`;
      ctx.fillStyle='#fff';
      const words=prod.name.split(' ');
      let cur='', lines=[];
      words.forEach(w=>{
        const t=(cur?cur+' ':'')+w;
        if(ctx.measureText(t).width>cw*.8&&cur){lines.push(cur);cur=w;}
        else cur=t;
      });
      lines.push(cur);
      const lh=fs*1.3, tot=lines.length*lh;
      lines.forEach((ln,i)=>ctx.fillText(ln,px,py-tot/2+i*lh+fs/2));

      // price
      ctx.font=`800 ${fs*1.25}px 'Segoe UI',sans-serif`;
      ctx.fillStyle='#fff';
      ctx.fillText('$'+prod.price, px, py+ch*.24);

      // THC
      if(cw>100){
        const thcL=prod.thc>=100?(prod.thc/10|0)+'mg':prod.thc+'mg';
        ctx.font=`${fs*.72}px 'Segoe UI',sans-serif`;
        ctx.fillStyle='rgba(140,165,185,.7)';
        ctx.fillText(thcL+' THC', px, py+ch*.34);
      }

      // brand
      if(cw>112){
        ctx.font=`${fs*.7}px 'Segoe UI',sans-serif`;
        ctx.fillStyle='rgba(100,130,150,.55)';
        ctx.fillText(prod.brand, px, py-ch*.36);
      }

      // terpene dots
      if(cw>90){
        const nd=Math.min(prod.terps.length,3);
        const gap=7, sx=px-(nd-1)*gap/2;
        ctx.globalAlpha=alpha*.4;
        for(let d=0;d<nd;d++){
          ctx.beginPath(); ctx.arc(sx+d*gap,py+ch*.43,2.2,0,Math.PI*2);
          ctx.fillStyle=col; ctx.fill();
        }
      }

      // lane tag above nearest cards
      if(depth>.7&&ease>.48){
        const tag=prod.s.charAt(0).toUpperCase()+prod.s.slice(1);
        ctx.globalAlpha=.72*ease;
        ctx.font=`700 ${Math.max(9,cw*.068)}px 'Segoe UI',sans-serif`;
        ctx.fillStyle=col;
        ctx.fillText(tag, px, py-ch*.58);
      }
    }

    ctx.globalAlpha=1;
    hits.push({id:prod.id,x:px-cw/2,y:py-ch/2,w:cw,h:ch});
  });
}

// ══════════════════════════════════════════
//  MINIMAP
// ══════════════════════════════════════════
function updateMiniMap(ordered,total){
  const mm=document.getElementById('mmap');
  mm.querySelectorAll('.mmn').forEach(e=>e.remove());
  const mw=mm.clientWidth||160, mh=mm.clientHeight||64;
  ordered.forEach((p,i)=>{
    const l=LANE[p.s]||LANE.hybrid;
    const mx=(total>1?i/(total-1):.5)*mw;
    const my=mh/2+l.xB*mh*.5;
    const n=document.createElement('div');
    n.className='mmn';
    n.style.cssText=`width:4px;height:4px;background:${l.c};left:${mx-2}px;top:${my-2}px`;
    mm.appendChild(n);
  });
  const c=document.getElementById('mmc');
  const frac=total>1?(ST.off%total)/(total-1):.5;
  c.style.left=Math.max(0,Math.min(mw-2,frac*mw))+'px';
}

// ══════════════════════════════════════════
//  DETAIL BOTTOM SHEET — opens when hex clicked
// ══════════════════════════════════════════
function openSheet(id){
  ST.sel=id;
  const p=P.find(x=>x.id===id); if(!p) return;
  const l=LANE[p.s]||LANE.hybrid;
  const thcL=p.thc>=100?(p.thc/10|0)+'mg':p.thc+'mg';
  const cbdL=p.cbd>0?(p.cbd>=100?(p.cbd/10|0)+'mg':p.cbd+'mg'):'None';

  // hex header SVG
  const hexSvg=`<svg width="54" height="62" viewBox="0 0 54 62">
    <polygon points="27,2 51,15.5 51,46.5 27,60 3,46.5 3,15.5" fill="rgba(0,8,22,.95)" stroke="${l.c}" stroke-width="2"/>
    <text x="27" y="28" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="8" font-weight="700" fill="${l.c}" letter-spacing="1">${p.fx}</text>
    <text x="27" y="42" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#fff">$${p.price}</text>
  </svg>`;

  document.getElementById('sheet-hex').innerHTML=`
    <div class="sh-hex">${hexSvg}</div>
    <div class="sh-info">
      <div class="sh-name">${p.name}</div>
      <div class="sh-sub">${p.s.charAt(0).toUpperCase()+p.s.slice(1)} · ${p.brand} · ${thcL} THC</div>
    </div>
    <div class="sh-price">$${p.price}</div>
  `;

  document.getElementById('sheet-scroll').innerHTML=`
    <div class="sg">
      <div class="sc"><div class="scl">Effect</div><div class="scv">${p.fx}</div></div>
      <div class="sc"><div class="scl">Strain</div><div class="scv" style="color:${l.c}">${p.s.charAt(0).toUpperCase()+p.s.slice(1)}</div></div>
      <div class="sc"><div class="scl">THC</div><div class="scv">${thcL}</div></div>
      <div class="sc"><div class="scl">CBD</div><div class="scv">${cbdL}</div></div>
    </div>
    <p class="sdesc">${p.desc}</p>
    <div class="ssh">Terpenes</div>
    <div class="tlist">${p.terps.map(t=>`<span class="tc">${t}</span>`).join('')}</div>
    <div class="ssh">Phyletic Lineage</div>
    <div class="phylo">
      ${p.lin.map((ln,i)=>`<div>${'&nbsp;'.repeat(i*3)}${i?'└─ ':''}${ln}</div>`).join('')}
      <div>${'&nbsp;'.repeat(p.lin.length*3)}└─ <span class="pfin" style="color:${l.c}">${p.name}</span></div>
    </div>
    <button class="sadd" onclick="addToCart(${p.id})">Add to Cart &nbsp;—&nbsp; $${p.price}</button>
    <button class="sfav">☆ Save to Favourites</button>
  `;

  document.getElementById('sheet').classList.add('open');
  document.getElementById('dim').classList.add('show');
  ST.sheetOpen=true;
}

function closeSheet(){
  ST.sel=null; ST.sheetOpen=false;
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('dim').classList.remove('show');
}
window.closeSheet=closeSheet;

function addToCart(id){
  const p=P.find(x=>x.id===id);
  if(p) alert(`Added "${p.name}" ($${p.price}) to cart!`);
}
window.addToCart=addToCart;

// ══════════════════════════════════════════
//  FILTER DRAWER
// ══════════════════════════════════════════
function toggleDrawer(){
  const d=document.getElementById('drawer');
  const t=document.getElementById('ftoggle');
  const open=d.classList.toggle('open');
  t.classList.toggle('on',open);
}
window.toggleDrawer=toggleDrawer;

// ══════════════════════════════════════════
//  NAV
// ══════════════════════════════════════════
function step(d){ ST.off+=d; }
window.step=step;

// ══════════════════════════════════════════
//  FILTERS
// ══════════════════════════════════════════
function setCat(btn){
  ST.cat=btn.dataset.c; ST.off=0; closeSheet();
  document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b===btn));
}
function setStrain(row){
  ST.strain=row.dataset.s;
  document.querySelectorAll('[data-s]').forEach(r=>r.classList.toggle('on',r===row));
}
function setSort(row){
  ST.sort=row.dataset.o;
  document.querySelectorAll('[data-o]').forEach(r=>r.classList.toggle('on',r===row));
}
function setTHC(inp){
  ST.thcMax=+inp.value*10;
  document.getElementById('tval').textContent=inp.value;
}
window.setCat=setCat; window.setStrain=setStrain;
window.setSort=setSort; window.setTHC=setTHC;

// ══════════════════════════════════════════
//  DRAG / TOUCH / WHEEL / CLICK
// ══════════════════════════════════════════
cv.addEventListener('mousedown',e=>{
  if(ST.sheetOpen) return;
  ST.drag=true; ST.dx=e.clientX; ST.doff=ST.off;
});
window.addEventListener('mousemove',e=>{
  if(!ST.drag) return;
  ST.off=ST.doff-(e.clientX-ST.dx)/82;
});
window.addEventListener('mouseup',()=>{ ST.drag=false; });

cv.addEventListener('touchstart',e=>{
  if(ST.sheetOpen) return;
  ST.drag=true; ST.dx=e.touches[0].clientX; ST.doff=ST.off;
},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(!ST.drag) return;
  ST.off=ST.doff-(e.touches[0].clientX-ST.dx)/82;
},{passive:true});
cv.addEventListener('touchend',()=>{ ST.drag=false; });

cv.addEventListener('wheel',e=>{
  if(!ST.sheetOpen){ ST.off+=e.deltaY*.01; e.preventDefault(); }
},{passive:false});

cv.addEventListener('click',e=>{
  if(ST.sheetOpen) return;
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  for(let i=hits.length-1;i>=0;i--){
    const h=hits[i];
    if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h){
      openSheet(h.id); return;
    }
  }
});

// sheet swipe-down to close
let sheetDragY=0, sheetDragStart=0;
const sheet=document.getElementById('sheet');
sheet.addEventListener('touchstart',e=>{ sheetDragStart=e.touches[0].clientY; },{passive:true});
sheet.addEventListener('touchmove',e=>{
  const dy=e.touches[0].clientY-sheetDragStart;
  if(dy>0) sheet.style.transform=`translateY(${dy}px)`;
},{passive:true});
sheet.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-sheetDragStart;
  if(dy>80){ closeSheet(); sheet.style.transform=''; }
  else sheet.style.transform='';
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){step(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){step(-1);e.preventDefault();}
  else if(e.key==='PageDown'){step(3);e.preventDefault();}
  else if(e.key==='PageUp'){step(-3);e.preventDefault();}
  else if(e.key==='Escape'){if(ST.sheetOpen)closeSheet();else if(document.getElementById('drawer').classList.contains('open'))toggleDrawer();}
  else if(e.key==='f'||e.key==='F') toggleDrawer();
});

// ══════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════
let lastTs=null;
function loop(ts){
  if(!lastTs) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,.08); lastTs=ts; bgT+=dt;

  // auto-scroll when not dragging and sheet is closed
  if(!ST.drag&&!ST.sheetOpen){
    ST.off+=ST.speed*dt;
    const pr=getProds(); if(pr.length) ST.off%=pr.length;
  }

  drawBg(dt);
  const prods=getProds(), ordered=buildOrder(prods), total=prods.length;
  drawCards(ordered,total);
  updateMiniMap(ordered,total);

  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════
//  INIT — defer one frame so root has layout
// ══════════════════════════════════════════
window.addEventListener('resize',resize);

// Double rAF ensures the DOM has painted and root has real dimensions
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  resize();
  requestAnimationFrame(loop);
}));
</script>
</body>
