<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>NeuoTunnel</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;
  background:#03070f;
  font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;
  color:#b8cce0;-webkit-font-smoothing:antialiased;}

/* ── APP SHELL ── */
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  background:#03070f;
}

/* ── TOP BAR ── */
#top{
  flex-shrink:0;height:50px;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:rgba(3,7,15,.96);
  border-bottom:1px solid rgba(0,180,255,.18);
}
.logo{flex-shrink:0;line-height:1;}
.lt{font-size:11px;font-weight:800;letter-spacing:3.5px;color:#00e5ff;}
.ls{font-size:6.5px;letter-spacing:3px;color:#5fff80;margin-top:1px;}
.sep{width:1px;height:22px;background:rgba(0,180,255,.18);flex-shrink:0;}
#cats{
  display:flex;gap:5px;flex:1;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
#cats::-webkit-scrollbar{display:none;}
.cat{
  flex-shrink:0;padding:5px 13px;border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:transparent;color:#445565;
  font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;
  -webkit-appearance:none;
}
.cat.on{color:#00e5ff;border-color:#00e5ff;background:rgba(0,229,255,.1);}

/* ── TREE AREA (fixed height, holds the SVG phyletic diagram) ── */
#tree-area{
  flex-shrink:0;height:100px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 80% 120% at 50% 100%,#070f20,#03070f 70%);
}
#tree-svg{position:absolute;inset:0;width:100%;height:100%;}
/* branch labels sit at the top of the three columns */
.branch-label{
  position:absolute;top:6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transform:translateX(-50%);
}
.bl-icon{font-size:14px;}
.bl-name{font-size:7.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;}
.bl-strain{font-size:6px;letter-spacing:1.5px;color:#3a5060;}

/* ── THREE-COLUMN TILES ── */
#cols{
  flex:1;overflow:hidden;
  display:flex;
  border-top:1px solid rgba(255,255,255,.05);
}
.col{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:6px 4px 24px;
}
.col::-webkit-scrollbar{display:none;}
#col-hybrid{
  border-left:1px solid rgba(255,255,255,.05);
  border-right:1px solid rgba(255,255,255,.05);
}

/* ── PRODUCT TILE ── */
.tile{
  margin:4px 3px;
  padding:9px 8px 8px;
  border-radius:10px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
  border-left:3px solid var(--lc,#00e5ff);
  cursor:pointer;position:relative;overflow:hidden;
}
.tile::after{
  content:'';position:absolute;top:0;right:0;width:35%;height:100%;
  background:linear-gradient(to left,rgba(var(--lr),var(--lg),var(--lb),.07),transparent);
  pointer-events:none;
}
.tile:active{background:rgba(255,255,255,.07);}
.t-fx{font-size:7.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--lc);opacity:.8;margin-bottom:2px;}
.t-name{font-size:11.5px;font-weight:700;color:#e8f0f8;line-height:1.25;margin-bottom:4px;}
.t-row{display:flex;align-items:baseline;gap:4px;}
.t-price{font-size:12px;font-weight:800;color:#fff;}
.t-thc{font-size:8px;color:#445565;margin-left:auto;}
.t-dots{display:flex;gap:2px;margin-top:4px;}
.t-dot{width:5px;height:5px;border-radius:50%;background:var(--lc);opacity:.35;}
.empty{padding:24px 6px;text-align:center;font-size:10px;color:#2a3a48;line-height:1.7;}

/* ── DIM ── */
#dim{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,4,12,.72);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#dim.show{opacity:1;pointer-events:auto;}

/* ── BOTTOM SHEET ── */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-height:78vh;
  background:#050d1c;
  border-top:1px solid rgba(0,180,255,.22);
  border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;
  transform:translateY(106%);
  transition:transform .28s cubic-bezier(.22,.68,0,1.1);
  overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.open{transform:translateY(0);}
.sh-handle{flex-shrink:0;padding:11px 0 5px;display:flex;justify-content:center;}
.sh-handle div{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);}
#sh-close{
  position:absolute;top:10px;right:12px;
  width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:#778899;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-appearance:none;
}
#sh-top{
  flex-shrink:0;padding:0 14px 12px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.sh-hex{
  flex-shrink:0;width:50px;height:50px;
  display:flex;align-items:center;justify-content:center;
}
.sh-info{flex:1;min-width:0;}
.sh-name{font-size:16px;font-weight:800;color:#fff;margin-bottom:3px;line-height:1.2;}
.sh-sub{font-size:10.5px;color:#445565;}
.sh-prc{font-size:22px;font-weight:800;flex-shrink:0;}
#sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 16px;}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;}
.sc{background:rgba(255,255,255,.04);border-radius:8px;padding:8px 4px;text-align:center;}
.scl{font-size:7.5px;letter-spacing:1.5px;text-transform:uppercase;color:#334455;margin-bottom:4px;}
.scv{font-size:12px;font-weight:700;color:#c0d0e8;}
.ssl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#00e5ff;opacity:.45;margin:14px 0 7px;}
.sd{font-size:13px;color:#5a7080;line-height:1.6;}
.tl{display:flex;flex-wrap:wrap;gap:5px;}
.tc{font-size:10.5px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.06);color:#7a8a9a;}
.pb{font-size:11px;color:#2e4050;line-height:1.9;font-family:ui-monospace,monospace;}
.pf{font-weight:700;}
.sa{
  display:block;width:100%;margin-top:16px;padding:13px;border-radius:12px;
  background:linear-gradient(125deg,#00e5ff 0%,#5fff80 100%);
  color:#03070f;font-size:14px;font-weight:800;
  border:none;cursor:pointer;letter-spacing:.3px;-webkit-appearance:none;
}
.sf{
  display:block;width:100%;margin-top:8px;padding:10px;border-radius:12px;
  background:transparent;border:1px solid rgba(255,255,255,.1);
  color:#3a5060;font-size:12.5px;cursor:pointer;-webkit-appearance:none;
}
</style>
</head>

// ── LANE CONFIG ──
const LANE = {
  sativa: { c:'#5fff80', r:95,  g:255, b:128, icon:'🌿', label:'SATIVA',  hint:'Energizing' },
  hybrid: { c:'#00e5ff', r:0,   g:229, b:255, icon:'⚡', label:'HYBRID',  hint:'Balanced'   },

let curCat = 'edibles';

// ── FORMAT HELPERS ──
function fmtThc(v){ return v >= 100 ? (v/10|0)+'mg' : v+'%'; }

// ═══════════════════════════════════════
//  DRAW PHYLETIC TREE SVG
// ═══════════════════════════════════════
function drawTree(){
  const area = document.getElementById('tree-area');
  const W = area.clientWidth  || window.innerWidth  || 375;
  const H = area.clientHeight || 100;

  // column centre x positions
  const cx  = W / 2;
  const s_x = W * (1/6);   // sativa col centre
  const h_x = W * (3/6);   // hybrid col centre
  const i_x = W * (5/6);   // indica col centre
  const tipY = 28;          // where branch tips reach (top)
  const forkY = H - 16;     // trunk fork point (bottom)
  const rootY = H - 4;      // "CANNABIS" label y

  const svg = document.getElementById('tree-svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Trunk → fork
  const trunkPath = `M ${cx} ${rootY} L ${cx} ${forkY}`;

  // Curved branches from fork to each column tip
  const sBranch = `M ${cx} ${forkY} C ${cx} ${forkY-20}, ${s_x} ${tipY+30}, ${s_x} ${tipY}`;
  const hBranch = `M ${cx} ${forkY} L ${h_x} ${tipY}`;
  const iBranch = `M ${cx} ${forkY} C ${cx} ${forkY-20}, ${i_x} ${tipY+30}, ${i_x} ${tipY}`;

  svg.innerHTML = `
    <!-- trunk -->
    <path d="${trunkPath}" stroke="rgba(0,180,255,.22)" stroke-width="1.8" fill="none"/>
    <!-- sativa branch -->
    <path d="${sBranch}" stroke="rgba(95,255,128,.35)" stroke-width="1.4" fill="none"/>
    <!-- hybrid branch -->
    <path d="${hBranch}" stroke="rgba(0,229,255,.28)" stroke-width="1.4" fill="none"/>
    <!-- indica branch -->
    <path d="${iBranch}" stroke="rgba(176,111,255,.35)" stroke-width="1.4" fill="none"/>
    <!-- root node -->
    <circle cx="${cx}" cy="${forkY}" r="4" fill="#00e5ff" opacity=".3"/>
    <!-- branch tip nodes -->
    <circle cx="${s_x}" cy="${tipY}" r="3.5" fill="#5fff80" opacity=".55"/>
    <circle cx="${h_x}" cy="${tipY}" r="3.5" fill="#00e5ff" opacity=".55"/>
    <circle cx="${i_x}" cy="${tipY}" r="3.5" fill="#b06fff" opacity=".55"/>
    <!-- CANNABIS root label -->
    <text x="${cx}" y="${rootY+1}" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="7" letter-spacing="2"
      fill="rgba(0,180,255,.35)" dominant-baseline="auto">CANNABIS</text>
    <!-- branch labels -->
    <text x="${s_x}" y="${tipY-10}" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="8" font-weight="700" letter-spacing="2"
      fill="rgba(95,255,128,.75)">🌿 SATIVA</text>
    <text x="${h_x}" y="${tipY-10}" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="8" font-weight="700" letter-spacing="2"
      fill="rgba(0,229,255,.75)">⚡ HYBRID</text>
    <text x="${i_x}" y="${tipY-10}" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="8" font-weight="700" letter-spacing="2"
      fill="rgba(176,111,255,.75)">🌙 INDICA</text>
  `;
}

// ═══════════════════════════════════════
//  RENDER TILES INTO COLUMNS
// ═══════════════════════════════════════
function renderTiles(){
  ['sativa','hybrid','indica'].forEach(s => {
    const el  = document.getElementById('list-'+s);
    const lc  = LANE[s];
    const arr = PRODS.filter(p => p.c === curCat && p.s === s);

    if (!arr.length){
      el.innerHTML = `<div class="empty">No ${lc.label}<br>products in<br>${curCat}</div>`;
      return;
    }

    el.innerHTML = arr.map(p => {
      const dots = p.t.slice(0,3).map(()=>`<div class="t-dot"></div>`).join('');
      return `<div class="tile" data-id="${p.id}"
        style="--lc:${lc.c};--lr:${lc.r};--lg:${lc.g};--lb:${lc.b}">
        <div class="t-fx">${p.fx}</div>
        <div class="t-name">${p.n}</div>
        <div class="t-row">
          <div class="t-price">$${p.$}</div>
          <div class="t-thc">${fmtThc(p.thc)}</div>
        </div>
        <div class="t-dots">${dots}</div>
      </div>`;
    }).join('');
  });
}

// ═══════════════════════════════════════
//  DETAIL SHEET
// ═══════════════════════════════════════
function openSheet(id){
  const p = PRODS.find(x => x.id === +id);
  if (!p) return;
  const lc = LANE[p.s];

  // hex SVG badge
  const hexSvg = `<svg width="50" height="56" viewBox="0 0 50 56" xmlns="http://www.w3.org/2000/svg">
    <polygon points="25,2 48,14 48,42 25,54 2,42 2,14"
      fill="rgba(3,7,15,.9)" stroke="${lc.c}" stroke-width="1.6"/>
    <text x="25" y="24" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="7" font-weight="700"
      fill="${lc.c}" letter-spacing="1">${p.fx}</text>
    <text x="25" y="38" text-anchor="middle"
      font-family="-apple-system,sans-serif" font-size="11" font-weight="800"
      fill="#ffffff">$${p.$}</text>
  </svg>`;

  document.getElementById('sh-top').innerHTML = `
    <div class="sh-hex">${hexSvg}</div>
    <div class="sh-info">
      <div class="sh-name">${p.n}</div>
      <div class="sh-sub">${p.s[0].toUpperCase()+p.s.slice(1)} · ${p.br}</div>
    </div>
    <div class="sh-prc" style="color:${lc.c}">$${p.$}</div>
  `;

  const thcL = fmtThc(p.thc);
  const cbdL = p.cbd > 0 ? fmtThc(p.cbd) : 'None';
  const lin  = [...p.lin, p.n];

  document.getElementById('sh-body').innerHTML = `
    <div class="sg">
      <div class="sc">
        <div class="scl">Effect</div>
        <div class="scv" style="color:${lc.c}">${p.fx}</div>
      </div>
      <div class="sc">
        <div class="scl">THC</div>
        <div class="scv">${thcL}</div>
      </div>
      <div class="sc">
        <div class="scl">CBD</div>
        <div class="scv">${cbdL}</div>
      </div>
      <div class="sc">
        <div class="scl">Strain</div>
        <div class="scv">${p.s[0].toUpperCase()+p.s.slice(1)}</div>
      </div>
    </div>

    <div class="ssl">About</div>
    <p class="sd">${p.d}</p>

    <div class="ssl">Terpenes</div>
    <div class="tl">${p.t.map(t=>`<span class="tc">${t}</span>`).join('')}</div>

    <div class="ssl">Phyletic Lineage</div>
    <div class="pb">${lin.map((l,i)=>{
      const pad = '&nbsp;'.repeat(i*3);
      const prefix = i===0 ? '' : '└─ ';
      const cls = i===lin.length-1 ? `class="pf" style="color:${lc.c}"` : '';
      return `<div>${pad}${prefix}<span ${cls}>${l}</span></div>`;
    }).join('')}</div>

    <button class="sa" onclick="addCart(${p.id})">Add to Cart &mdash; $${p.$}</button>
    <button class="sf" onclick="saveFav(${p.id})">☆ Save to Favourites</button>
  `;

  document.getElementById('sheet').classList.add('open');
  document.getElementById('dim').classList.add('show');
}

function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('dim').classList.remove('show');
}
function addCart(id){ const p=PRODS.find(x=>x.id===id); if(p) alert(`Added "${p.n}" to cart!`); }
function saveFav(id){ const p=PRODS.find(x=>x.id===id); if(p) alert(`Saved "${p.n}"`); }

// ═══════════════════════════════════════
//  EVENT WIRING
// ═══════════════════════════════════════

// Category pills
document.querySelectorAll('.cat').forEach(btn => {
  btn.addEventListener('click', () => {
    curCat = btn.dataset.c;
    document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b===btn));
    renderTiles();
  });
});

// Tile tap — delegate on #cols
document.getElementById('cols').addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (tile) openSheet(tile.dataset.id);
});

// Bottom sheet close
document.getElementById('sh-close').addEventListener('click', closeSheet);
document.getElementById('dim').addEventListener('click', closeSheet);

// Sheet swipe-down to dismiss
let shY0 = 0;
const sheetEl = document.getElementById('sheet');
sheetEl.addEventListener('touchstart', e => { shY0 = e.touches[0].clientY; }, { passive:true });
sheetEl.addEventListener('touchmove',  e => {
  const dy = e.touches[0].clientY - shY0;
  if (dy > 0) sheetEl.style.transform = `translateY(${dy}px)`;
}, { passive:true });
sheetEl.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - shY0;
  sheetEl.style.transform = '';
  if (dy > 70) closeSheet();
});

// Keyboard
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// Resize
window.addEventListener('resize', drawTree);

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
drawTree();
renderTiles();
</script>
</body>
</html>
