<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>NeuoTunnel</title>
<style>
/* ── reset + iOS helpers ── */
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #000812;
  font-family: -apple-system, 'Segoe UI', sans-serif;
  color: #c0d0e0;
  -webkit-font-smoothing: antialiased;
}

/* ── full-screen app ── */
#app {
  position: fixed; inset: 0;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  overflow: hidden;
}

/* ── background: tunnel rings ── */
#bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 48%, #000c28 0%, #000812 100%);
  pointer-events: none; z-index: 0;
}
.ring {
  position: absolute; border-radius: 50%;
  border: 1px solid;
  transform: translate(-50%, -50%);
}
/* rail lines */
.rail {
  position: absolute; bottom: 0;
  height: 55%; width: 1px;
  transform-origin: bottom center;
  pointer-events: none;
}
/* floating particles */
@keyframes rise {
  0%   { transform: translateY(0)   translateX(0);   opacity: .7; }
  100% { transform: translateY(-180px) translateX(var(--dx)); opacity: 0; }
}
.pt { position: absolute; border-radius: 50%; pointer-events: none; animation: rise var(--dur) ease-in forwards; }

/* ── card layer ── */
#cards {
  position: absolute; inset: 0; z-index: 5;
  touch-action: none;  /* stop iOS from claiming the touch for scroll */
}

/* Each card: outer div = touch target (no clip-path),
   inner .cv = hexagonal visual shell */
.card {
  position: absolute;
  cursor: pointer;
  /* transition for smooth repositioning at low fps */
  transition: opacity .15s;
}
.cv {
  width: 100%; height: 100%;
  clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1px;
}
/* glow border via inset shadow on the clipped element */
.cv::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(160deg, var(--gc,rgba(0,229,255,.18)), transparent 55%);
  pointer-events: none;
}
.card.sel .cv { outline: none; }

/* text inside cards */
.c-fx    { font-size: .58em; letter-spacing: 1.8px; text-transform: uppercase; color: var(--lc); opacity: .85; }
.c-name  { font-size: .78em; font-weight: 700; color: #fff; text-align: center; line-height: 1.2; padding: 0 6%; }
.c-brand { font-size: .58em; color: rgba(160,180,200,.6); }
.c-price { font-size: 1em; font-weight: 800; color: #fff; }
.c-thc   { font-size: .54em; color: rgba(140,165,185,.65); }
.c-dots  { display: flex; gap: 3px; margin-top: 2px; }
.c-dot   { width: 4px; height: 4px; border-radius: 50%; background: var(--lc); opacity: .45; }
/* selection ring */
.sel-ring {
  position: absolute; inset: -12%;
  border-radius: 50%;
  border: 2px solid var(--lc);
  opacity: 0; pointer-events: none;
  animation: none;
}
.card.sel .sel-ring { opacity: .6; animation: pulsering 1.8s ease-in-out infinite; }
@keyframes pulsering { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:.2;transform:scale(1.08)} }

/* lane labels */
.lane-lbl {
  position: absolute; z-index: 6; pointer-events: none;
  font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  padding: 3px 9px; border-radius: 10px;
  background: rgba(0,5,15,.75); border: 1px solid;
  opacity: 0; transition: opacity .4s;
}
.lane-lbl.show { opacity: .75; }

/* ── top bar ── */
#top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 30;
  height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: rgba(0,5,18,.85);
  border-bottom: 1px solid rgba(0,180,255,.2);
  /* blur on iOS */
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.logo { display: flex; flex-direction: column; flex-shrink: 0; }
.lt { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: #00e5ff; }
.ls { font-size: 7px;  letter-spacing: 3px; color: #5fff80; }
.sep { width: 1px; height: 20px; background: rgba(0,180,255,.2); flex-shrink: 0; }
#cats {
  display: flex; gap: 4px; flex: 1;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#cats::-webkit-scrollbar { display: none; }
.cat {
  flex-shrink: 0; padding: 4px 12px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.1);
  background: transparent; color: #4a6070;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  cursor: pointer; transition: color .15s, border-color .15s, background .15s;
}
.cat.on { color: #00e5ff; border-color: #00e5ff; background: rgba(0,229,255,.12); }
.fltbtn {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(0,180,255,.18);
  color: #4a6070; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .15s, border-color .15s;
}
.fltbtn.on { color: #00e5ff; border-color: #00e5ff; }

/* ── side nav arrows ── */
.nav-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 20; width: 34px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,5,18,.55);
  border: 1px solid rgba(0,180,255,.18);
  color: rgba(0,229,255,.6); font-size: 18px; cursor: pointer;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: background .15s, color .15s;
}
#nav-l { left: 0; border-radius: 0 10px 10px 0; border-left: none; }
#nav-r { right: 0; border-radius: 10px 0 0 10px; border-right: none; }
.nav-arrow:active { background: rgba(0,229,255,.2); color: #00e5ff; }

/* ── filter drawer ── */
#drawer {
  position: absolute; top: 48px; left: 0; bottom: 0; width: 186px; z-index: 40;
  background: rgba(0,5,18,.97);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border-right: 1px solid rgba(0,180,255,.18);
  padding: 12px 10px; overflow-y: auto;
  transform: translateX(-100%);
  transition: transform .26s cubic-bezier(.22,.68,0,1.1);
  -webkit-overflow-scrolling: touch;
}
#drawer.open { transform: translateX(0); }
.dh { font-size: 8px; letter-spacing: 2.5px; text-transform: uppercase; color: #00e5ff; opacity: .55; margin: 12px 0 6px; }
.dh:first-child { margin-top: 0; }
.dr {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: 7px;
  font-size: 12px; color: #c0d0e0; cursor: pointer;
}
.dr.on { background: rgba(0,229,255,.12); color: #00e5ff; }
.dd { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dc { margin-left: auto; font-size: 9px; color: #00e5ff; opacity: 0; }
.dr.on .dc { opacity: 1; }
.dsl { width: 100%; accent-color: #00e5ff; margin: 4px 0 2px; }
.dv { font-size: 10px; color: #4a6070; margin-bottom: 4px; }
#mm {
  width: 100%; height: 62px; margin-top: 8px;
  border: 1px solid rgba(0,229,255,.18); border-radius: 6px;
  background: rgba(0,12,35,.7); position: relative; overflow: hidden;
}
.mn { position: absolute; border-radius: 50%; }
.mc { position: absolute; width: 1.5px; height: 100%; top: 0; background: rgba(255,255,255,.5); transition: left .2s; }
.kr { display: flex; justify-content: space-between; font-size: 10px; color: #4a6070; padding: 2px 0; }
.kk { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 3px; padding: 1px 5px; font-size: 9px; color: #888; }

/* ── dim overlay ── */
#dim {
  position: absolute; inset: 0; z-index: 35;
  background: rgba(0,5,15,.65);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
#dim.show { opacity: 1; pointer-events: auto; }

/* ── bottom sheet ── */
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
  max-height: 72vh;
  background: rgba(0,5,20,.98);
  border-top: 1px solid rgba(0,180,255,.25);
  border-radius: 18px 18px 0 0;
  display: flex; flex-direction: column;
  transform: translateY(105%);
  transition: transform .3s cubic-bezier(.22,.68,0,1.1);
  /* prevent sheet scroll from bubbling */
  overscroll-behavior: contain;
}
#sheet.open { transform: translateY(0); }
.sh-handle {
  flex-shrink: 0; padding: 10px 0 4px;
  display: flex; justify-content: center; cursor: grab;
}
.sh-handle div { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); }
.sh-top {
  flex-shrink: 0; padding: 4px 16px 12px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid rgba(0,180,255,.12);
}
.sh-hex-wrap { flex-shrink: 0; }
.sh-info { flex: 1; min-width: 0; }
.sh-name  { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.2; margin-bottom: 3px; }
.sh-meta  { font-size: 11px; color: #4a6070; }
.sh-price { font-size: 26px; font-weight: 800; color: #fff; flex-shrink: 0; }
.sh-close {
  position: absolute; top: 10px; right: 12px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  color: #aaa; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
/* scrollable body */
#sh-body {
  flex: 1; overflow-y: auto; padding: 14px 16px 24px;
  -webkit-overflow-scrolling: touch;

.sg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.sc { background: rgba(0,12,30,.8); border: 1px solid rgba(0,180,255,.14); border-radius: 8px; padding: 8px 10px; }

.tc  { font-size: 10px; padding: 3px 9px; border-radius: 8px; background: rgba(0,229,255,.07); border: 1px solid rgba(0,229,255,.2); color: #00e5ff; }
.pb  { background: rgba(0,8,22,.8); border: 1px solid rgba(0,180,255,.14); border-radius: 8px; padding: 10px; margin-bottom: 14px; font-size: 11px; line-height: 2.1; color: #c0d0e0; }
.pf  { font-weight: 700; }
.sa  { width: 100%; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 800; border: none; cursor: pointer; background: linear-gradient(135deg,#00e5ff,#0066ff); color: #000; margin-bottom: 8px; }
.sf  { width: 100%; padding: 11px; border-radius: 10px; font-size: 12px; border: 1px solid rgba(0,180,255,.2); background: transparent; color: #4a6070; cursor: pointer; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(0,229,255,.2); border-radius: 2px; }
</style>

  {id:26, n:'1:1 Rest Formula',      s:'hybrid',c:'tinctures',$:40, thc:300, cbd:300,fx:'Sleep',      t:['Linalool','Myrcene'],           br:'Papa & Barkley',lin:['Broad-spectrum','OG Kush'],     d:'Sublingual drops for nighttime recovery with balanced cannabinoids.'},
  {id:27, n:'Sativa Rise Drops',     s:'sativa',c:'tinctures',$:36, thc:250, cbd:50, fx:'Energize',   t:['Limonene','Pinene'],            br:'Dosist',        lin:['ACDC','Jack Herer'],             d:'Morning formula to sharpen focus and elevate mood.'},
  {id:28, n:'CBD Relief Balm',       s:'hybrid',c:'topicals', $:28, thc:0,   cbd:500, fx:'Relief',    t:['Caryophyllene','Menthol'],      br:'Lord Jones',    lin:['Hemp CBD'],                      d:'Cooling menthol balm with high-potency CBD for targeted relief.'},
];

const LANE = {
  sativa: { c:'#5fff80', xB:-.34, yB:-.13 },
  hybrid: { c:'#00e5ff', xB:  .0, yB: .12 },
  indica: { c:'#b06fff', xB: .34, yB:-.10 },
};

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const ST = {
  cat:'edibles', strain:'all', sort:'price_asc', thcMax:1e6,
  off:0, speed:0, sel:null, sheetOpen:false,
};

// ═══════════════════════════════════════
//  SCREEN SIZE (no canvas issues)
// ═══════════════════════════════════════
let W = 1, H = 1;
function getSize() {
  const app = document.getElementById('app');
  W = app.clientWidth  || window.innerWidth  || 375;
  H = app.clientHeight || window.innerHeight || 812;
}

// ═══════════════════════════════════════
//  BUILD BACKGROUND RINGS (once)
// ═══════════════════════════════════════
function buildBg() {
  const bg = document.getElementById('bg');
  bg.innerHTML = '';
  const vx = W/2, vy = H*.47;

  // rings — concentric ellipses converging at vanishing point
  for (let i = 1; i <= 12; i++) {
    const t = i/12;
    const rx = W*.58*t, ry = H*.54*t;
    const el = document.createElement('div');
    el.className = 'ring';
    const hue = 180 + t*120;
    const alpha = (.04 + t*.06).toFixed(3);
    el.style.cssText = `
      left:${vx}px; top:${vy}px;
      width:${rx*2}px; height:${ry*2}px;
      border-color: hsla(${hue},70%,58%,${alpha});
      animation-duration:${3.5+t*2}s;
      animation-delay:${-i*.4}s;
      margin-left:${-rx}px; margin-top:${-ry}px;
    `;
    bg.appendChild(el);
  }

  // inline SVG rail lines
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;pointer-events:none');
  const rails = [[0,H,vx,vy,.07],[W,H,vx,vy,.07],[W*.28,H,vx,vy,.04],[W*.72,H,vx,vy,.04]];
  rails.forEach(([x1,y1,x2,y2,a])=>{
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',`rgba(0,200,255,${a})`);
    l.setAttribute('stroke-width','1');
    svg.appendChild(l);
  });

  // lane colour hazes
  [['#5fff80',-.34],['#00e5ff',0],['#b06fff',.34]].forEach(([col,xB])=>{
    const r = parseInt(col.slice(1,3),16);
    const g = parseInt(col.slice(3,5),16);
    const b = parseInt(col.slice(5,7),16);
    const cx = vx + xB*W*.5, cy = H*.68;
    const sz = W*.22;
    const haze = document.createElement('div');
    haze.style.cssText = `
      position:absolute; width:${sz*2}px; height:${sz*2}px;
      left:${cx-sz}px; top:${cy-sz}px; border-radius:50%; pointer-events:none;
      background:radial-gradient(circle, rgba(${r},${g},${b},.07) 0%, transparent 70%);
    `;
    bg.appendChild(haze);
  });

  bg.appendChild(svg);
}

// ═══════════════════════════════════════
//  PRODUCTS
// ═══════════════════════════════════════
function getProds() {
  return PRODS
    .filter(p => p.c === ST.cat)
    .filter(p => ST.strain === 'all' || p.s === ST.strain)
    .filter(p => p.thc <= ST.thcMax)
    .sort((a,b) => {
      if (ST.sort==='price_asc')  return a.$-b.$;
      if (ST.sort==='price_desc') return b.$-a.$;
      if (ST.sort==='thc_desc')   return b.thc-a.thc;
      if (ST.sort==='terpene')    return a.t[0].localeCompare(b.t[0]);
      return a.n.localeCompare(b.n);
    });
}

function buildOrder(prods) {
  const g = { sativa:[], hybrid:[], indica:[] };
  prods.forEach(p => { if (g[p.s]) g[p.s].push(p); });
  const mx = Math.max(...Object.values(g).map(a=>a.length), 0);
  const out = [];
  for (let i=0; i<mx; i++)
    ['sativa','hybrid','indica'].forEach(s => { if (g[s][i]) out.push({...g[s][i], ti:out.length}); });
  return out;
}

// ═══════════════════════════════════════
//  CARD POOL — reuse DOM elements
// ═══════════════════════════════════════
const POOL_SIZE = 20;
const pool = [];
const cardsEl = document.getElementById('cards');

function initPool() {
  for (let i=0; i<POOL_SIZE; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="sel-ring"></div>
      <div class="cv">
        <div class="c-fx"></div>
        <div class="c-name"></div>
        <div class="c-brand"></div>
        <div class="c-price"></div>
        <div class="c-thc"></div>
        <div class="c-dots"></div>
      </div>`;
    card.style.display = 'none';
    cardsEl.appendChild(card);
    pool.push({ el:card, id:null });
  }
}

function positionCards(ordered, total) {
  if (!total) { pool.forEach(p=>p.el.style.display='none'); return; }

  // hide all first
  pool.forEach(p => { p.el.style.display='none'; p.id=null; });

  // remove old lane labels
  cardsEl.querySelectorAll('.lane-lbl').forEach(e=>e.remove());

  const vx = W/2, vy = H*.47;
  const SPAN = 4.6, CN = Math.min(170, W*.42), CF = 44;

  // build items, sorted far→near
  const items = [];
  ordered.forEach((prod, i) => {
    let rel = i - ST.off % Math.max(1,total);
    if (total >= 6) {
      while (rel > total/2)  rel -= total;
      while (rel < -total/2) rel += total;
    }
    if (Math.abs(rel) > SPAN) return;
    const depth = Math.max(0, 1 - Math.abs(rel)/SPAN);
    const ease  = depth*depth;
    items.push({ prod, rel, depth, ease });
  });
  items.sort((a,b) => a.depth - b.depth);

  let poolIdx = 0;
  const nearestByLane = {};

  items.forEach(({ prod, rel, depth, ease }) => {
    if (poolIdx >= POOL_SIZE) return;
    const slot = pool[poolIdx++];
    const lane = LANE[prod.s] || LANE.hybrid;
    const col  = lane.c;
    const isSel = ST.sel === prod.id;

    const px = vx + lane.xB * W * ease * .74;
    const py = vy + lane.yB * H * ease * .46 + rel * H * .038 * (1-depth*.5);
    const cw = CF + (CN-CF)*ease;
    const ch = cw * 1.12;
    const op = .18 + depth*.82;
    const z  = Math.round(depth * 90);

    const thcL = prod.thc>=100 ? (prod.thc/10|0)+'mg' : prod.thc+'mg';
    const fs   = Math.max(8, cw*.074);
    const r=parseInt(col.slice(1,3),16), g=parseInt(col.slice(3,5),16), b=parseInt(col.slice(5,7),16);

    slot.id = prod.id;
    const el = slot.el;
    el.style.cssText = `
      display:block;
      left:${px-cw/2}px; top:${py-ch/2}px;
      width:${cw}px; height:${ch}px;
      opacity:${op}; z-index:${z};
      font-size:${fs}px;
      --lc:${col};
    `;
    el.classList.toggle('sel', isSel);

    // visual shell
    const cv = el.querySelector('.cv');
    cv.style.cssText = `
      background:rgba(0,${8+(ease*14)|0},${22+(ease*28)|0},.93);
      box-shadow: 0 0 ${ease*18|0}px rgba(${r},${g},${b},${(.12+ease*.22).toFixed(2)}),
                  inset 0 0 ${ease*14|0}px rgba(0,0,0,.4);
      outline:${isSel?`2.5px solid ${col}`:'none'};
      --gc:rgba(${r},${g},${b},.18);
    `;

    // text content
    el.querySelector('.c-fx').textContent    = prod.fx;
    el.querySelector('.c-name').textContent  = prod.n;
    el.querySelector('.c-brand').textContent = cw>100 ? prod.br : '';
    el.querySelector('.c-price').textContent = '$'+prod.$;
    el.querySelector('.c-thc').textContent   = cw>100 ? thcL+' THC' : '';
    // terpene dots
    const dotsEl = el.querySelector('.c-dots');
    dotsEl.innerHTML = prod.t.slice(0,3).map(()=>'<div class="c-dot"></div>').join('');

    el.dataset.pid = prod.id;

    // track nearest by lane for label
    if (!nearestByLane[prod.s] || depth > nearestByLane[prod.s].depth)
      nearestByLane[prod.s] = { x:px, y:py-ch/2-6, depth, col };
  });

  // lane labels
  Object.entries(nearestByLane).forEach(([strain,{x,y,depth,col}])=>{
    if (depth < .65) return;
    const lbl = document.createElement('div');
    lbl.className = 'lane-lbl show';
    lbl.textContent = strain.toUpperCase();
    lbl.style.cssText = `left:${x-28}px;top:${y-22}px;color:${col};border-color:${col}55;z-index:99;`;
    cardsEl.appendChild(lbl);
  });

  // minimap
  updateMinimap(ordered, total);
}

function updateMinimap(ordered, total) {
  const mm = document.getElementById('mm');
  mm.querySelectorAll('.mn').forEach(e=>e.remove());
  const mw = mm.clientWidth || 160, mh = mm.clientHeight || 62;
  ordered.forEach((p,i) => {
    const lane = LANE[p.s]||LANE.hybrid;
    const x = total>1 ? (i/(total-1))*mw : mw/2;
    const y = mh/2 + lane.xB*mh*.5;
    const n = document.createElement('div');
    n.className = 'mn';
    n.style.cssText = `width:4px;height:4px;background:${lane.c};left:${x-2}px;top:${y-2}px`;
    mm.appendChild(n);
  });
  const mc = document.getElementById('mc');
  const frac = total>1 ? (ST.off%total)/(total-1) : .5;
  mc.style.left = Math.max(0, Math.min(mw-2, frac*mw))+'px';
}

// ═══════════════════════════════════════
//  DETAIL SHEET
// ═══════════════════════════════════════
function openSheet(id) {
  ST.sel = id;
  const p = PRODS.find(x=>x.id===id); if (!p) return;
  const lane = LANE[p.s]||LANE.hybrid;
  const thcL = p.thc>=100 ? (p.thc/10|0)+'mg' : p.thc+'mg';
  const cbdL = p.cbd>0 ? (p.cbd>=100 ? (p.cbd/10|0)+'mg' : p.cbd+'mg') : 'None';
  const col  = lane.c;

  // hex icon (inline SVG)
  const hexSvg = `<svg width="52" height="60" viewBox="0 0 52 60">
    <polygon points="26,2 50,14.5 50,45.5 26,58 2,45.5 2,14.5"
      fill="rgba(0,8,24,.95)" stroke="${col}" stroke-width="1.8"/>
    <text x="26" y="26" text-anchor="middle"
      font-family="-apple-system,'Segoe UI',sans-serif"
      font-size="7.5" font-weight="700" fill="${col}" letter-spacing="1">${p.fx}</text>
    <text x="26" y="42" text-anchor="middle"
      font-family="-apple-system,'Segoe UI',sans-serif"
      font-size="12" font-weight="800" fill="#fff">$${p.$}</text>
  </svg>`;

  document.getElementById('sh-top').innerHTML = `
    <div class="sh-hex-wrap">${hexSvg}</div>
    <div class="sh-info">
      <div class="sh-name">${p.n}</div>
      <div class="sh-meta">${p.s.charAt(0).toUpperCase()+p.s.slice(1)} · ${p.br} · ${thcL} THC</div>
    </div>
    <div class="sh-price" style="color:${col}">$${p.$}</div>
  `;

  document.getElementById('sh-body').innerHTML = `
    <div class="sg">
      <div class="sc"><div class="scl">Effect</div><div class="scv">${p.fx}</div></div>
      <div class="sc"><div class="scl">Strain</div><div class="scv" style="color:${col}">${p.s.charAt(0).toUpperCase()+p.s.slice(1)}</div></div>
      <div class="sc"><div class="scl">THC</div><div class="scv">${thcL}</div></div>
      <div class="sc"><div class="scl">CBD</div><div class="scv">${cbdL}</div></div>
    </div>
    <p class="sd">${p.d}</p>
    <div class="ssl">Terpenes</div>
    <div class="tl">${p.t.map(t=>`<span class="tc">${t}</span>`).join('')}</div>
    <div class="ssl">Phyletic Lineage</div>
    <div class="pb">
      ${p.lin.map((l,i)=>`<div>${'&nbsp;'.repeat(i*3)}${i?'└─ ':''}${l}</div>`).join('')}
      <div>${'&nbsp;'.repeat(p.lin.length*3)}└─ <span class="pf" style="color:${col}">${p.n}</span></div>
    </div>
    <button class="sa" onclick="alert('Added ${p.n.replace(/'/g,'')} to cart!')">Add to Cart — $${p.$}</button>
    <button class="sf">☆ Save to Favourites</button>
  `;

  ST.sheetOpen = true;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('dim').classList.add('show');
}

function closeSheet() {
  ST.sel = null; ST.sheetOpen = false;
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('dim').classList.remove('show');
}

// ═══════════════════════════════════════
//  TOUCH HANDLING — single handler on cards layer
// ═══════════════════════════════════════
let tStartX=0, tStartY=0, tOffStart=0, tMoved=false;

cardsEl.addEventListener('touchstart', e => {
  if (ST.sheetOpen) return;
  const t = e.changedTouches[0];
  tStartX  = t.clientX;
  tStartY  = t.clientY;
  tOffStart= ST.off;
  tMoved   = false;
}, { passive:true });

cardsEl.addEventListener('touchmove', e => {
  if (ST.sheetOpen) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tStartX;
  if (Math.abs(dx) > 7) tMoved = true;
  if (tMoved) ST.off = tOffStart - dx/82;
}, { passive:true });

cardsEl.addEventListener('touchend', e => {
  if (ST.sheetOpen) return;
  const wasMoved = tMoved;
  tMoved = false;
  if (wasMoved) return; // was a drag, not a tap
  const cardEl = e.target.closest('.card');
  if (cardEl && cardEl.dataset.pid) openSheet(+cardEl.dataset.pid);
}, { passive:true });
cardsEl.addEventListener('touchcancel', () => { tMoved = false; }, { passive:true });

// mouse (desktop)
let mDown=false, mStartX=0, mOffStart=0, mMoved=false;
cardsEl.addEventListener('mousedown', e => {
  if (ST.sheetOpen) return;
  mDown=true; mStartX=e.clientX; mOffStart=ST.off; mMoved=false;
});
window.addEventListener('mousemove', e => {
  if (!mDown) return;
  const dx = e.clientX-mStartX;
  if (Math.abs(dx)>6) mMoved=true;
  if (mMoved) ST.off = mOffStart - dx/82;
});
window.addEventListener('mouseup', e => {
  if (!mDown) return; mDown=false;
  if (mMoved) return;
  const cardEl = e.target.closest('.card');
  if (cardEl && cardEl.dataset.pid) openSheet(+cardEl.dataset.pid);
});
cardsEl.addEventListener('wheel', e => {
  if (!ST.sheetOpen) ST.off += e.deltaY*.01;
  e.preventDefault();
}, { passive:false });

// sheet swipe down to dismiss
let shStartY=0;
const sheetEl = document.getElementById('sheet');
sheetEl.addEventListener('touchstart', e => {
  shStartY = e.touches[0].clientY;
}, { passive:true });
sheetEl.addEventListener('touchmove', e => {
  const dy = e.touches[0].clientY - shStartY;
  if (dy>0) sheetEl.style.transform=`translateY(${dy}px)`;
}, { passive:true });
sheetEl.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - shStartY;
  sheetEl.style.transform='';
  if (dy>80) closeSheet();
});

// close button & dim
document.getElementById('sh-close').addEventListener('click', closeSheet);
document.getElementById('dim').addEventListener('click', closeSheet);

// ═══════════════════════════════════════
//  NAV ARROWS
// ═══════════════════════════════════════
document.getElementById('nav-l').addEventListener('click', () => { ST.off -= 1; });
document.getElementById('nav-r').addEventListener('click', () => { ST.off += 1; });
document.getElementById('nav-l').addEventListener('touchend', e => { e.preventDefault(); ST.off -= 1; });
document.getElementById('nav-r').addEventListener('touchend', e => { e.preventDefault(); ST.off += 1; });

// ═══════════════════════════════════════
//  CATEGORY PILLS
// ═══════════════════════════════════════
document.querySelectorAll('.cat').forEach(btn => {
  btn.addEventListener('click', () => {
    ST.cat = btn.dataset.c; ST.off = 0; closeSheet();
    document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b===btn));
  });
});

// ═══════════════════════════════════════
//  FILTER DRAWER
// ═══════════════════════════════════════
document.getElementById('fltbtn').addEventListener('click', () => {
  const d = document.getElementById('drawer');
  const open = d.classList.toggle('open');
  document.getElementById('fltbtn').classList.toggle('on', open);
});
document.querySelectorAll('[data-s]').forEach(r => {
  r.addEventListener('click', () => {
    ST.strain = r.dataset.s;
    document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on', x===r));
  });
});
document.querySelectorAll('[data-o]').forEach(r => {
  r.addEventListener('click', () => {
    ST.sort = r.dataset.o;
    document.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('on', x===r));
  });
});
document.getElementById('tsl').addEventListener('input', function() {
  ST.thcMax = +this.value*10;
  document.getElementById('tv').textContent = this.value;
});

// ═══════════════════════════════════════
//  KEYBOARD (desktop)
// ═══════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') { ST.off+=1; e.preventDefault(); }
  else if (e.key==='ArrowLeft'||e.key==='ArrowUp') { ST.off-=1; e.preventDefault(); }
  else if (e.key==='Escape') { if(ST.sheetOpen) closeSheet(); else { const d=document.getElementById('drawer'); if(d.classList.contains('open')){ d.classList.remove('open'); document.getElementById('fltbtn').classList.remove('on'); } } }
  else if (e.key==='f'||e.key==='F') document.getElementById('fltbtn').click();
});

// ═══════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════
let lastTs = null;
function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min((ts-lastTs)/1000, .1); lastTs = ts;

  const prods   = getProds();
  const ordered = buildOrder(prods);
  positionCards(ordered, prods.length);

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════
//  INIT — wait for layout before starting
// ═══════════════════════════════════════
window.addEventListener('resize', () => {
  getSize();
  buildBg();
});

// iOS needs a tick for the viewport to settle
setTimeout(() => {
  getSize();
  buildBg();
  initPool();
  requestAnimationFrame(loop);
}, 60);
</script>
</body>
