<head>

<title>NeuoTunnel — Cannabis Kiosk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000812;color:#c0d0e0;
  font-family:'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#root{position:relative;width:100vw;height:100vh;overflow:hidden}

/* ── FULL-SCREEN CANVAS ── */
#c{position:absolute;inset:0;display:block}

/* ── FLOATING TOP BAR ── */
#top{
  position:absolute;top:0;left:0;right:0;height:50px;z-index:30;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(0,5,18,.84);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(0,180,255,.18);
}
.logo{display:flex;align-items:center;gap:7px;flex-shrink:0;text-decoration:none}
.logo-t{font-size:13px;font-weight:800;letter-spacing:3px;color:#00e5ff}
.logo-s{font-size:8px;letter-spacing:3px;color:#5fff80}
.vsep{width:1px;height:22px;background:rgba(0,180,255,.2);flex-shrink:0}
#cats{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat{
  flex-shrink:0;padding:4px 13px;border-radius:16px;border:1px solid rgba(255,255,255,.1);
  background:transparent;color:#4a6070;font-size:11px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:.18s;display:flex;align-items:center;gap:4px;
}
.cat:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.cat.on{color:#00e5ff;border-color:#00e5ff;background:rgba(0,229,255,.12);box-shadow:0 0 12px rgba(0,229,255,.18)}
.ico-btn{
  flex-shrink:0;width:34px;height:34px;border-radius:7px;
  background:rgba(255,255,255,.05);border:1px solid rgba(0,180,255,.2);
  color:#4a6070;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.ico-btn:hover,.ico-btn.on{color:#00e5ff;border-color:#00e5ff;background:rgba(0,229,255,.1)}

/* ── FLOATING BOTTOM BAR ── */
#bot{
  position:absolute;bottom:0;left:0;right:0;height:58px;z-index:30;
  display:flex;align-items:center;justify-content:center;gap:14px;padding:0 20px;
  background:rgba(0,5,18,.84);backdrop-filter:blur(16px);
  border-top:1px solid rgba(0,180,255,.18);
}
.cbtn{
  width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(0,229,255,.32);
  background:rgba(0,229,255,.07);color:#00e5ff;font-size:13px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;
}
.cbtn:hover{background:rgba(0,229,255,.22);box-shadow:0 0 14px rgba(0,229,255,.3)}
.cbtn.big{width:44px;height:44px;font-size:17px}
.price-wrap{display:flex;align-items:center;gap:8px;flex:1;max-width:260px}
.plbl{font-size:10px;color:#4a6070;flex-shrink:0}
#pslider{flex:1;accent-color:#00e5ff;cursor:pointer}
.pnow{font-size:12px;font-weight:700;color:#ffd060;flex-shrink:0;min-width:44px;text-align:right}
.here{
  font-size:10px;color:#ffd060;flex-shrink:0;white-space:nowrap;
  padding:3px 10px;border:1px solid rgba(255,208,96,.3);border-radius:10px;
  background:rgba(255,208,96,.07);
}

/* ── FILTER DRAWER (slide from left) ── */
#drawer{
  position:absolute;top:50px;left:0;bottom:58px;width:192px;z-index:40;
  background:rgba(0,6,20,.96);backdrop-filter:blur(20px);
  border-right:1px solid rgba(0,180,255,.18);
  padding:14px 11px;overflow-y:auto;
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.22,.68,0,1.1);
  scrollbar-width:thin;scrollbar-color:rgba(0,229,255,.18) transparent;
}
#drawer.open{transform:translateX(0)}
.dh{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:#00e5ff;opacity:.6;margin:14px 0 6px}
.dh:first-child{margin-top:0}
.drow{
  display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;
  font-size:12px;color:#c0d0e0;cursor:pointer;transition:.13s;
}
.drow:hover{background:rgba(0,229,255,.07);color:#fff}
.drow.on{background:rgba(0,229,255,.12);color:#00e5ff}
.ddot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chk{margin-left:auto;font-size:9px;color:#00e5ff;opacity:0;transition:.13s}
.drow.on .chk{opacity:1}
.ds{background:var(--c,#5fff80);box-shadow:0 0 5px var(--c,#5fff80)}
.dslider{width:100%;accent-color:#00e5ff;cursor:pointer;margin:5px 0 2px}
.dval{font-size:10px;color:#4a6070}
#mmap{
  width:100%;height:68px;margin-top:8px;
  border:1px solid rgba(0,229,255,.18);border-radius:7px;
  background:rgba(0,12,35,.7);position:relative;overflow:hidden;
}
.mmn{position:absolute;border-radius:50%}
.mmc{
  position:absolute;width:1.5px;height:100%;top:0;
  background:rgba(255,255,255,.6);box-shadow:0 0 6px rgba(255,255,255,.4);
  transition:left .25s;
}
.krow{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#4a6070;padding:2px 0}
.k{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:1px 5px;font-size:9px;color:#888}

/* ── DETAIL PANEL (slide from right) ── */
#panel{
  position:absolute;top:50px;right:0;bottom:58px;width:256px;z-index:40;
  background:rgba(0,6,20,.96);backdrop-filter:blur(20px);
  border-left:1px solid rgba(0,180,255,.18);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.68,0,1.1);
}
#panel.open{transform:translateX(0)}
#ph{
  flex-shrink:0;padding:11px 13px 9px;
  border-bottom:1px solid rgba(0,180,255,.18);
  display:flex;align-items:center;justify-content:space-between;
}
#ph span{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:#00e5ff;opacity:.65}
.pcls{
  width:24px;height:24px;border-radius:5px;border:1px solid rgba(0,180,255,.2);
  background:transparent;color:#4a6070;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.14s;
}
.pcls:hover{color:#fff;border-color:#fff}
#pscroll{flex:1;overflow-y:auto;padding:13px;scrollbar-width:thin;scrollbar-color:rgba(0,229,255,.18) transparent}
.dbar{height:2px;border-radius:1px;margin-bottom:12px}
.dname{font-size:15px;font-weight:800;color:#fff;line-height:1.25;margin-bottom:3px}
.dsub{font-size:11px;color:#4a6070;margin-bottom:9px}
.dprice{font-size:28px;font-weight:800;color:#fff}
.dthc{font-size:11px;color:#4a6070;margin-bottom:11px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:11px}
.dcell{background:rgba(0,12,30,.7);border:1px solid rgba(0,180,255,.15);border-radius:7px;padding:7px 9px}
.dclbl{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#4a6070;margin-bottom:2px}
.dcval{font-size:13px;font-weight:700;color:#fff}
.ddesc{font-size:11px;color:#c0d0e0;line-height:1.65;margin-bottom:11px}
.dsh{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#00e5ff;opacity:.6;margin-bottom:5px}
.tlist{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:11px}
.tchip{font-size:10px;padding:3px 8px;border-radius:9px;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.2);color:#00e5ff}
.pbox{background:rgba(0,8,22,.7);border:1px solid rgba(0,180,255,.15);border-radius:7px;padding:9px;margin-bottom:11px;font-size:11px;line-height:2;color:#c0d0e0}
.pfinal{font-weight:700}
.dbtn{
  width:100%;padding:10px;border-radius:8px;cursor:pointer;
  font-size:13px;font-weight:700;border:none;margin-bottom:6px;transition:.18s;
}
.dbtn.p{background:linear-gradient(135deg,#00e5ff,#0070ff);color:#000}
.dbtn.p:hover{opacity:.85;box-shadow:0 0 20px rgba(0,229,255,.35)}
.dbtn.g{background:transparent;border:1px solid rgba(0,180,255,.2);color:#4a6070}

/* ── PAUSE OVERLAY ── */
#po{
  position:absolute;inset:0;z-index:50;

  font-size:13px;letter-spacing:4px;color:#4a6070;pointer-events:none;
}
#po.show{display:flex}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(0,229,255,.2);border-radius:2px}

const LANE={
  sativa:{c:'#5fff80', xB:-.36, yB:-.13},
  hybrid:{c:'#00e5ff', xB:  .0, yB: .12},
  indica:{c:'#b06fff', xB: .36, yB:-.10},
};

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const ST={cat:'edibles',strain:'all',sort:'price_asc',thcMax:1e6,
  off:0,paused:false,sel:null,speed:.32,
  drag:false,dx:0,doff:0};

// ═══════════════════════════════════════════
//  CANVAS + CONTEXT
// ═══════════════════════════════════════════
const cv=document.getElementById('c');
const cx2=cv.getContext('2d');
let W=0,H=0,bgT=0,sparks=[];

function resize(){
  W=cv.width =window.innerWidth;
  H=cv.height=window.innerHeight;
}

// ═══════════════════════════════════════════
//  BACKGROUND — rings, rails, sparks
// ═══════════════════════════════════════════
function addSpark(){
  const cs=['#5fff80','#00e5ff','#b06fff','#ffd060'];
  sparks.push({x:Math.random()*W,y:H*(.35+Math.random()*.65),
    r:Math.random()*1.8+.5,c:cs[Math.random()*4|0],
    vx:(Math.random()-.5)*20,vy:-(Math.random()*1.4+.6),
    life:1,d:Math.random()*.007+.003});
}

function drawBg(dt){
  const vx=W/2, vy=H*.47;
  cx2.clearRect(0,0,W,H);

  // nebula
  const nb=cx2.createRadialGradient(vx,vy,0,vx,vy,W*.48);
  nb.addColorStop(0,'rgba(0,22,80,.18)');
  nb.addColorStop(.5,'rgba(0,10,40,.08)');
  nb.addColorStop(1,'transparent');
  cx2.fillStyle=nb;cx2.fillRect(0,0,W,H);

  // tunnel rings — elliptical, converging at vanishing point
  for(let i=16;i>=0;i--){
    const t=i/16;
    const rx=W*.58*t, ry=H*.54*t;
    const hue=(bgT*14+t*200)%360;
    const a=.03+t*.055;
    cx2.beginPath();
    cx2.ellipse(vx,vy,Math.max(rx,1),Math.max(ry,1),0,0,Math.PI*2);
    cx2.strokeStyle=`hsla(${hue},72%,58%,${a})`;
    cx2.lineWidth=t<.18?.6:1.1;
    cx2.stroke();
  }

  // 4 perspective rail lines to vanishing point
  [[-.47,1],[-.17,1],[.17,1],[.47,1]].forEach(([xf],i)=>{
    cx2.beginPath();
    cx2.moveTo(vx+xf*W,H);
    cx2.lineTo(vx,vy-H*.01);
    cx2.strokeStyle=`rgba(0,200,255,${i===0||i===3?.07:.04})`;
    cx2.lineWidth=i===0||i===3?1.1:.65;
    cx2.stroke();
  });

  // strain lane colour hazes at left/center/right
  [['#5fff80',-.36],['#00e5ff',0],['#b06fff',.36]].forEach(([col,xf])=>{
    const gx=vx+xf*W*.5, gy=H*.65;
    const hg=cx2.createRadialGradient(gx,gy,0,gx,gy,W*.18);
    hg.addColorStop(0,col.replace('#','rgba(').replace(/(.{2})(.{2})(.{2})/,
      (_,r,g,b)=>`rgba(${parseInt(r,16)},${parseInt(g,16)},${parseInt(b,16)}`)+`,.06)`);
    hg.addColorStop(1,'transparent');
    cx2.fillStyle=hg;cx2.fillRect(0,0,W,H);
  });

  // sparks
  if(!ST.paused&&Math.random()<.07) addSpark();
  for(let i=sparks.length-1;i>=0;i--){
    const sp=sparks[i];
    const pace=ST.paused?.1:1;
    sp.x+=sp.vx*dt*pace;
    sp.y+=sp.vy*55*dt*pace;
    sp.life-=sp.d*pace;
    if(sp.life<=0){sparks.splice(i,1);continue;}
    cx2.globalAlpha=sp.life*.7;
    cx2.beginPath();cx2.arc(sp.x,sp.y,sp.r,0,Math.PI*2);
    cx2.fillStyle=sp.c;cx2.fill();
  }
  cx2.globalAlpha=1;
}

// ═══════════════════════════════════════════
//  PRODUCT HELPERS
// ═══════════════════════════════════════════
function getProds(){
  return P
    .filter(p=>p.cat===ST.cat)
    .filter(p=>ST.strain==='all'||p.s===ST.strain)
    .filter(p=>p.thc<=ST.thcMax)
    .sort((a,b)=>{
      if(ST.sort==='price_asc')  return a.price-b.price;
      if(ST.sort==='price_desc') return b.price-a.price;
      if(ST.sort==='thc_desc')   return b.thc-a.thc;
      if(ST.sort==='terpene')    return a.terps[0].localeCompare(b.terps[0]);
      return a.name.localeCompare(b.name);
    });
}

function buildOrder(prods){
  const g={sativa:[],hybrid:[],indica:[]};
  prods.forEach(p=>{ if(g[p.s]) g[p.s].push(p); });
  const mx=Math.max(...Object.values(g).map(a=>a.length),0);
  const out=[];
  for(let i=0;i<mx;i++)
    ['sativa','hybrid','indica'].forEach(s=>{ if(g[s][i]) out.push({...g[s][i],ti:out.length}); });
  return out;
}

// ═══════════════════════════════════════════
//  HIT-TEST rectangles for click detection
// ═══════════════════════════════════════════
let hitRects=[];  // {id, x, y, w, h}

// ═══════════════════════════════════════════
//  DRAW CARDS ON CANVAS
// ═══════════════════════════════════════════
const SPAN=4.8, CN=160, CF=48;

function drawRoundedHex(ctx,x,y,w,h,r){
  // draw a rounded hexagon centred at x,y
  const hw=w/2,hh=h/2;
  const pts=[
    [x-hw*.5, y-hh],[x+hw*.5, y-hh],
    [x+hw, y],[x+hw*.5, y+hh],[x-hw*.5, y+hh],[x-hw, y]
  ];
  ctx.beginPath();
  pts.forEach(([px,py],i)=>{
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.closePath();
}

function drawCards(ordered,total){
  if(!total) return;
  hitRects=[];
  const vx=W/2, vy=H*.47;

  // collect items, sort far→near so near cards paint on top
  const items=[];
  ordered.forEach((prod,i)=>{
    let rel=i-ST.off%(total||1);
    if(total>=6){
      while(rel>total/2)  rel-=total;
      while(rel<-total/2) rel+=total;
    }
    if(Math.abs(rel)>SPAN) return;
    const depth=Math.max(0,1-Math.abs(rel)/SPAN);
    const ease=depth*depth;
    items.push({prod,rel,depth,ease});
  });
  items.sort((a,b)=>a.depth-b.depth);

  const prevByStrain={};

  items.forEach(({prod,rel,depth,ease})=>{
    const lane=LANE[prod.s]||LANE.hybrid;
    const col=lane.c;
    const px=vx + lane.xB*W*ease*.72;
    const py=vy + lane.yB*H*ease*.46 + rel*H*.040*(1-depth*.5);
    const cw=(CF+(CN-CF)*ease);
    const ch=cw*1.12;
    const alpha=.18+depth*.82;
    const isSel=ST.sel===prod.id;

    // branch connection line (Bézier)
    if(prevByStrain[prod.s]&&depth>.1){
      const pv=prevByStrain[prod.s];
      const mx2=(pv.x+px)/2, my2=(pv.y+py)/2-14*ease;
      cx2.beginPath();
      cx2.moveTo(pv.x,pv.y);
      cx2.quadraticCurveTo(mx2,my2,px,py);
      const lAlpha=Math.min(depth,pv.depth)*.28;
      cx2.strokeStyle=hexAlpha(col,lAlpha);
      cx2.setLineDash([3,8]);
      cx2.lineWidth=ease*1.8;
      cx2.stroke();
      cx2.setLineDash([]);
    }
    prevByStrain[prod.s]={x:px,y:py,depth};

    // outer glow
    if(depth>.3){
      const glowR=cw*.75;
      const rg=cx2.createRadialGradient(px,py,0,px,py,glowR);
      rg.addColorStop(0,hexAlpha(col,ease*(isSel?.28:.1)));
      rg.addColorStop(1,'transparent');
      cx2.fillStyle=rg;
      cx2.beginPath();
      cx2.arc(px,py,glowR,0,Math.PI*2);
      cx2.fill();
    }

    // hexagon fill
    cx2.globalAlpha=alpha;
    drawRoundedHex(cx2,px,py,cw,ch,4);
    cx2.fillStyle=`rgba(0,${8+ease*14|0},${20+ease*28|0},.92)`;
    cx2.fill();

    // hex stroke
    cx2.strokeStyle=isSel?col:hexAlpha(col,.45+ease*.45);
    cx2.lineWidth=isSel?2.5:1.4*ease+.4;
    cx2.stroke();

    // inner glow on selected
    if(isSel){
      drawRoundedHex(cx2,px,py,cw,ch,4);
      cx2.strokeStyle=hexAlpha(col,.55);
      cx2.lineWidth=5;
      cx2.stroke();
      // pulse ring
      const pr=cw*.72;
      cx2.beginPath();cx2.arc(px,py,pr,0,Math.PI*2);
      cx2.strokeStyle=hexAlpha(col,.35+Math.sin(bgT*3)*.2);
      cx2.lineWidth=2;cx2.stroke();
    }

    // text — only when big enough
    if(cw>70){
      cx2.globalAlpha=alpha;
      const fs=Math.max(8,cw*.075);

      // effect label
      cx2.font=`600 ${fs*.82}px 'Segoe UI',sans-serif`;
      cx2.fillStyle=col;cx2.textAlign='center';
      cx2.fillText(prod.fx.toUpperCase(), px, py-ch*.24);

      // product name (wrap if needed)
      cx2.font=`700 ${fs}px 'Segoe UI',sans-serif`;
      cx2.fillStyle='#ffffff';
      const words=prod.name.split(' ');
      let line='',lines=[],lineH=fs*1.3;
      words.forEach(w=>{
        const test=(line?line+' ':'')+w;
        if(cx2.measureText(test).width>cw*.8&&line){
          lines.push(line);line=w;
        } else line=test;
      });
      lines.push(line);
      const totalH=lines.length*lineH;
      lines.forEach((l,i)=>cx2.fillText(l,px,py-totalH/2+i*lineH+fs/2));

      // price
      cx2.font=`800 ${fs*1.2}px 'Segoe UI',sans-serif`;
      cx2.fillStyle='#ffffff';
      cx2.fillText('$'+prod.price, px, py+ch*.23);

      // thc label
      if(cw>100){
        const thcL=prod.thc>=100?(prod.thc/10|0)+'mg':prod.thc+'mg';
        cx2.font=`${fs*.75}px 'Segoe UI',sans-serif`;
        cx2.fillStyle='rgba(150,170,190,.75)';
        cx2.fillText(thcL+' THC', px, py+ch*.33);
      }

      // brand dot row
      if(cw>110){
        cx2.font=`${fs*.72}px 'Segoe UI',sans-serif`;
        cx2.fillStyle='rgba(100,130,150,.6)';
        cx2.fillText(prod.brand, px, py-ch*.35);
      }

      // terpene dots
      if(cw>90){
        const nd=Math.min(prod.terps.length,3);
        const gap=8;
        const startX=px-(nd-1)*gap/2;
        for(let d=0;d<nd;d++){
          cx2.beginPath();
          cx2.arc(startX+d*gap, py+ch*.42, 2.5,0,Math.PI*2);
          cx2.fillStyle=col;cx2.globalAlpha=alpha*.45;cx2.fill();
        }
        cx2.globalAlpha=alpha;
      }
    }

    // lane tag above the nearest (deepest) card
    if(depth>.72&&ease>.5){
      const tag=prod.s.toUpperCase();
      cx2.globalAlpha=.7*ease;
      cx2.font=`700 ${Math.max(9,cw*.065)}px 'Segoe UI',sans-serif`;
      cx2.fillStyle=col;
      cx2.fillText(tag, px, py-ch*.58);
    }

    cx2.globalAlpha=1;

    // save hit rect
    hitRects.push({id:prod.id, x:px-cw/2, y:py-ch/2, w:cw, h:ch});
  });
}

// helper: hex colour + alpha  "#rrggbb" -> "rgba(r,g,b,a)"
function hexAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ═══════════════════════════════════════════
//  MINIMAP
// ═══════════════════════════════════════════
function updateMiniMap(ordered,total){
  const mm=document.getElementById('mmap');
  mm.querySelectorAll('.mmn').forEach(e=>e.remove());
  const mw=mm.clientWidth, mh=mm.clientHeight;
  ordered.forEach((p,i)=>{
    const lane=LANE[p.s]||LANE.hybrid;
    const mx=(total>1?(i/(total-1)):0.5)*mw;
    const my=mh/2+lane.xB*mh*.5;
    const n=document.createElement('div');
    n.className='mmn';
    n.style.cssText=`width:4px;height:4px;background:${lane.c};left:${mx-2}px;top:${my-2}px`;
    mm.appendChild(n);
  });
  const cursor=document.getElementById('mmc');
  const frac=total>1?(ST.off%total)/(total-1):.5;
  cursor.style.left=Math.max(0,Math.min(mw-2,frac*mw))+'px';
}

// ═══════════════════════════════════════════
//  MAIN RENDER (called every frame)
// ═══════════════════════════════════════════
function render(dt){
  drawBg(dt);
  const prods=getProds(), ordered=buildOrder(prods), total=ordered.length;
  drawCards(ordered,total);
  // HUD
  if(total>0){
    const idx=Math.round(ST.off)%total;
    const p=ordered[Math.max(0,idx)];
    if(p) document.getElementById('pnow').textContent=p.price;
  }
  updateMiniMap(ordered,total);
}

// ═══════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════
function selectProduct(id){
  ST.sel=id;
  const p=P.find(x=>x.id===id); if(!p) return;
  const lane=LANE[p.s]||LANE.hybrid;
  const thcL=p.thc>=100?(p.thc/10|0)+'mg':p.thc+'mg';
  const cbdL=p.cbd>0?(p.cbd>=100?(p.cbd/10|0)+'mg':p.cbd+'mg'):'None';
  const pf=document.getElementById('pfill');
  pf.style.setProperty('--lc',lane.c);
  pf.innerHTML=`
    <div class="dbar" style="background:${lane.c};box-shadow:0 0 10px ${lane.c}"></div>
    <div class="dname">${p.name}</div>
    <div class="dsub">${p.s.charAt(0).toUpperCase()+p.s.slice(1)} · ${p.fx}</div>
    <div class="dprice">$${p.price}</div>
    <div class="dthc">${thcL} THC · ${cbdL} CBD</div>
    <div class="dgrid">
      <div class="dcell"><div class="dclbl">Effect</div><div class="dcval">${p.fx}</div></div>
      <div class="dcell"><div class="dclbl">Strain</div><div class="dcval" style="color:${lane.c}">${p.s.charAt(0).toUpperCase()+p.s.slice(1)}</div></div>
      <div class="dcell"><div class="dclbl">THC</div><div class="dcval">${thcL}</div></div>
      <div class="dcell"><div class="dclbl">Brand</div><div class="dcval">${p.brand}</div></div>
    </div>
    <p class="ddesc">${p.desc}</p>
    <div class="dsh">Terpenes</div>
    <div class="tlist">${p.terps.map(t=>`<span class="tchip">${t}</span>`).join('')}</div>
    <div class="dsh">Phyletic Lineage</div>
    <div class="pbox">
      ${p.lin.map((l,i)=>`<div>${'&nbsp;'.repeat(i*3)}${i?'└─ ':''}${l}</div>`).join('')}
      <div>${'&nbsp;'.repeat(p.lin.length*3)}└─ <span class="pfinal" style="color:${lane.c}">${p.name}</span></div>
    </div>
    <button class="dbtn p" onclick="alert('Added!')">Add to Cart — $${p.price}</button>
    <button class="dbtn g">☆ Save to Favourites</button>`;
  openPanel();
}

function openPanel(){
  document.getElementById('panel').classList.add('open');
  document.getElementById('ptoggle').style.display='flex';
  document.getElementById('ptoggle').classList.add('on');
}
function closePanel(){
  ST.sel=null;
  document.getElementById('panel').classList.remove('open');
  document.getElementById('ptoggle').classList.remove('on');
}
window.closePanel=closePanel;

// ═══════════════════════════════════════════
//  DRAWER / PANEL TOGGLES
// ═══════════════════════════════════════════
function toggleDrawer(){
  const d=document.getElementById('drawer');
  const t=document.getElementById('ftoggle');
  d.classList.toggle('open');t.classList.toggle('on',d.classList.contains('open'));
}
function togglePanel(){
  const p=document.getElementById('panel');
  if(p.classList.contains('open')) closePanel();
  else openPanel();
}
window.toggleDrawer=toggleDrawer; window.togglePanel=togglePanel;

// ═══════════════════════════════════════════
//  NAV / CONTROLS
// ═══════════════════════════════════════════
function step(d){ ST.off+=d; }
function jump(d){ ST.off+=d; }
function seekTo(pct){
  const pr=getProds(); if(!pr.length) return;
  ST.off=(pct/100)*(pr.length-1);
}
function togglePause(){
  ST.paused=!ST.paused;
  document.getElementById('playbtn').textContent=ST.paused?'▶':'⏸';
  document.getElementById('po').classList.toggle('show',ST.paused);
}
window.step=step;window.jump=jump;window.seekTo=seekTo;window.togglePause=togglePause;

// ═══════════════════════════════════════════
//  FILTERS
// ═══════════════════════════════════════════
function setCat(btn){
  ST.cat=btn.dataset.c; ST.off=0; closePanel();
  document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b===btn));
}
function setStrain(row){
  ST.strain=row.dataset.s;
  document.querySelectorAll('[data-s]').forEach(r=>r.classList.toggle('on',r===row));
}
function setSort(row){
  ST.sort=row.dataset.o;
  document.querySelectorAll('[data-o]').forEach(r=>r.classList.toggle('on',r===row));
}
function setTHC(inp){
  ST.thcMax=parseInt(inp.value)*10;
  document.getElementById('tval').textContent=inp.value;
}
window.setCat=setCat;window.setStrain=setStrain;window.setSort=setSort;window.setTHC=setTHC;

// ═══════════════════════════════════════════
//  INPUT — drag, wheel, click, keyboard
// ═══════════════════════════════════════════
cv.addEventListener('mousedown',e=>{
  ST.drag=true; ST.dx=e.clientX; ST.doff=ST.off;
});
window.addEventListener('mousemove',e=>{
  if(!ST.drag) return;
  ST.off=ST.doff-(e.clientX-ST.dx)/85;
});
window.addEventListener('mouseup',()=>{ ST.drag=false; });

cv.addEventListener('touchstart',e=>{ ST.drag=true;ST.dx=e.touches[0].clientX;ST.doff=ST.off; },{passive:true});
cv.addEventListener('touchmove', e=>{ if(!ST.drag)return; ST.off=ST.doff-(e.touches[0].clientX-ST.dx)/85; },{passive:true});
cv.addEventListener('touchend', ()=>{ ST.drag=false; });

cv.addEventListener('wheel',e=>{ ST.off+=e.deltaY*.01; e.preventDefault(); },{passive:false});

cv.addEventListener('click',e=>{
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  // check hit rects (in reverse paint order = near→far)
  for(let i=hitRects.length-1;i>=0;i--){
    const h=hitRects[i];
    if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h){
      selectProduct(h.id); return;
    }
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){step(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){step(-1);e.preventDefault();}
  else if(e.key==='PageDown'){jump(3);e.preventDefault();}
  else if(e.key==='PageUp'){jump(-3);e.preventDefault();}
  else if(e.key===' '){togglePause();e.preventDefault();}
  else if(e.key==='Escape'){closePanel();}
  else if(e.key==='f'||e.key==='F'){toggleDrawer();}
});

// ═══════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════
let lastTs=null;
function loop(ts){
  if(!lastTs) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,.08); lastTs=ts; bgT+=dt;
  if(!ST.paused&&!ST.drag){
    ST.off+=ST.speed*dt;
    const pr=getProds(); if(pr.length) ST.off%=pr.length;
  }
  render(dt);
  requestAnimationFrame(loop);
}

window.addEventListener('resize',resize);
resize();
requestAnimationFrame(loop);
</script>
