name: Deploy The Immense Abyss
on:
  push:
    branches: [main]
    paths:
      - "abyss/**"
      - ".github/workflows/deploy-abyss.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test game in mobile-sized browser
        run: node abyss/test-game.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: abyss
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
